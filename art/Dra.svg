<svg xmlns="http://www.w3.org/2000/svg" viewBox="-275 -190 465 305">
  <!-- Draco, the dragon: a long serpentine dragon winding between the two bears.
       Its crested head lies under Hercules' foot, jaws open to the west with the forked tongue
       out to mu (Arrakis). Eltanin at the back of the head, Rastaban in the lower jaw, nu in the eye,
       Grumium on the crown. The neck rises through Altais to the coil around the ecliptic pole
       (Tyl at its top, Alahakan and Aldhiba on the way down); the body runs down through
       Aldhibah, Athebyne, theta and Edasich, and the tail climbs through Thuban and kappa
       to Giausar at its tip. -->
