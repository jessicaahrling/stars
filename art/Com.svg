<svg xmlns="http://www.w3.org/2000/svg" viewBox="-80 -75 155 170">
  <!-- Coma Berenices, Berenice's hair (Berenikes hår): the lock queen Berenice cut off and
       gave to the gods, drawn as a long braid. Its cut end lies in the west, tied with a ribbon
       bow; Al Dafirah (gamma, "the braid") sits on the tie and the bow's streamers flutter over
       the Coma star cluster. The braid runs east to beta at its bend, hangs south to a jewelled
       band with Diadem (alpha) as the jewel, and ends in loose curls. -->
