  <!-- Phoenix, the fabulous bird rising from its pyre (after Bayer and Bode): wings spread,
       crested head turned west in profile, tail hanging into the flames above two logs.
       Ankaa (alpha) on the nape just behind the head and kappa lower on the neck, as in Bayer;
       beta on the inner part of the spread east wing, gamma on its coverts and delta on its
       secondaries, epsilon on the west wing. Zeta (Wurren) burns in the flames, whose west
       tongue licks up towards delta, and eta lies on the lower log of the pyre. -->
