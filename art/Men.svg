<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -82 120 92">
  <!-- Mensa (Taffelberget), Lacaille's Mons Mensae, "la Montagne de la Table": Table Mountain
       above Cape Town, where he mapped the southern sky, seen from Table Bay with north up.
       The flat table stands in the middle with Devil's Peak to the east and Lion's Head to the
       west, and the "tablecloth" cloud lies on its top (Lacaille's nod to the Large Magellanic
       Cloud just north of it). Beta sits on the west end of the table under the cloud, alpha on
       the front of Devil's Peak beside its spur, eta on the lower slopes below the west cliffs,
       and gamma at the foot of the mountain above the shore. -->
