<svg xmlns="http://www.w3.org/2000/svg" viewBox="-112 -60 210 112">
  <!-- Piscis Austrinus, the southern fish (Södra fisken): a large fish swimming east towards
       Fomalhaut, head raised and mouth open to drink the stream poured from Aquarius' jar.
       Upright as in the later atlases (Aratus had it on its back). Fomalhaut (alpha, "the fish's
       mouth") sits in the open mouth, epsilon at the front of the spiny dorsal fin, delta and gamma
       on the chin and throat, beta and mu on the belly above the pelvic and anal fins,
       theta on the upper lobe and iota on the lower lobe of the forked tail.
       Parts: head with open jaws, dorsal fin, back, tail, belly with pelvic and anal fins,
       gill cover, pectoral fin; fine lines for the eye, fin rays, lateral line and a row of scales. -->
