<svg xmlns="http://www.w3.org/2000/svg" viewBox="-49 -79 149 195">
  <!-- Octans (Oktanten), Lacaille's reflecting octant (l'Octans de Reflexion), Hadley's
       navigation instrument: a 45-degree frame of two arms and a graduated limb, braced by a
       crossbar. Its apex points south and its limb arcs across the north. Delta sits in the
       index mirror on the pivot at the apex, the index arm runs from there to the vernier on the
       limb, where nu (the brightest star) shows in the vernier window, and beta sits at the top
       of the east arm where it joins the limb. A sight vane and the half-silvered horizon mirror
       face each other across the frame. -->
  <g>
  <!-- the frame: two arms, the apex boss and the limb, with an A-shaped crossbar -->
  <path d="M 47.7 90 L 25.4 58.2 M 22.3 53.7 L -40.3 -35.7 C -28.2 -44.9 -14.9 -52.3 -0.8 -57.8 M 17.7 -63.7 C 42 -70 67.3 -70.6 91.8 -65.5 L 66.2 85.9 C 67.8 87.1 69 88.8 69.7 90.6 C 70.5 92.4 70.7 94.4 70.5 96.4 C 70.3 98.4 69.6 100.3 68.5 101.9 C 67.3 103.6 65.8 104.9 64 105.8 C 62.3 106.7 60.3 107.1 58.3 107.1 C 56.3 107 54.4 106.5 52.6 105.5 C 50.9 104.5 49.4 103.1 48.4 101.4 C 47.3 99.7 46.7 97.8 46.6 95.8 C 46.5 93.8 46.9 91.8 47.7 90"/>
  <path d="M 45.4 65.8 L 35.3 51.3 M 32.1 46.8 L 13.5 20.2 L 29.6 16.6 M 36.6 15 L 67.2 8.1 L 61.4 42.6 M 60.3 48.8 L 55.9 75"/>
  <path d="M 7.3 11.3 L -17.9 -24.6 C -10 -29.6 -1.6 -33.9 7.2 -37.3 M 23.2 -42.4 C 40.6 -46.9 58.6 -48 76.3 -45.8 L 69 -2.6 L 33.5 5.4 M 26.5 7 L 7.3 11.3"/>
  <!-- graduated scale on the limb -->
  <path class="fine" d="M -23.6 -32.8 C -15 -38.3 -5.9 -42.9 3.6 -46.6 M 20.7 -52.1 C 39.4 -56.9 58.9 -58.1 78 -55.7 M -18.5 -35.9 L -24.6 -46.2 M -12.8 -39.1 L -15.6 -44.4 M -6.8 -42.1 L -12 -52.9 M -0.8 -44.8 L -3.1 -50.3 M 24.4 -53 L 23.1 -58.9 M 30.9 -54.4 L 28.7 -66.2 M 37.4 -55.4 L 36.6 -61.4 M 44 -56.2 L 42.9 -68.1 M 50.6 -56.7 L 50.3 -62.7 M 57.3 -56.9 L 57.2 -68.9 M 63.9 -56.8 L 64.1 -62.8 M 70.5 -56.4 L 71.5 -68.4"/>
  <!-- sight vane on the east arm, half-silvered horizon mirror on the west arm -->
  <path d="M 21.5 54.3 L 33.7 45.7 L 36.9 50.2 L 24.6 58.8 L 21.5 54.3 Z"/>
  <path class="fine" d="M 30.5 52.2 C 30.5 52.9 29.9 53.5 29.2 53.5 C 28.5 53.5 27.9 52.9 27.9 52.2 C 27.9 51.5 28.5 50.9 29.2 50.9 C 29.9 50.9 30.5 51.5 30.5 52.2 Z"/>
  <path d="M 57.7 45.4 L 69.6 36.2 L 73.9 41.7 L 62 50.9 L 57.7 45.4 Z"/>
  <path class="fine" d="M 63.6 40.8 L 67.9 46.3 M 62.1 48.1 L 66 45.1"/>
  <!-- index arm from the pivot to the vernier, with the index mirror on the pivot -->
  <path d="M 54 92.5 L 19.7 -14.2 C 16.9 -22.8 11.3 -26.5 8.8 -33.1 L -2.1 -61 C 4.1 -63.4 10.4 -65.5 16.9 -67.1 L 24.3 -38.1 C 26.1 -31.3 23.8 -25 26.5 -16.4 L 60 87.8"/>
  <path class="fine" d="M 7.1 -48.4 L 3.6 -58.3 C 7 -59.5 10.4 -60.7 13.9 -61.6 L 16.7 -51.5 C 13.5 -50.6 10.3 -49.6 7.1 -48.4 Z M 11.9 -50.1 L 11.1 -52.5 M 16 -44.1 C 16 -42.9 15.1 -41.9 13.8 -41.9 C 12.6 -41.9 11.6 -42.9 11.6 -44.1 C 11.6 -45.3 12.6 -46.3 13.8 -46.3 C 15.1 -46.3 16 -45.3 16 -44.1 Z"/>
  <path d="M 49.7 95.8 L 62.3 86 L 66.6 91.5 L 54 101.3 L 49.7 95.8 Z"/>
  <path class="fine" d="M 54 98.1 L 63.4 90.7"/>
  </g>
</svg>
