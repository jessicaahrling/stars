<svg xmlns="http://www.w3.org/2000/svg" viewBox="-150 -105 290 215">
  <!-- Capricornus, the sea-goat: a goat's fore half facing west, head lowered under a
       long ridged ibex horn, forelegs bent beneath the chest, the body running east past a
       shaggy fringe into a scaly fish tail that curls up into a forked fin. Algedi (alpha)
       on the horn, Dabih (beta) the eye, rho the throat, psi the near knee, omega the bent
       far knee, theta and iota on the back, zeta on the belly above the belly fin,
       Nashira (gamma) and Deneb Algedi (delta) on the tail. -->
