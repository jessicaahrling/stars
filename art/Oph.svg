  <!-- Ophiuchus, the serpent bearer (Ormbäraren): a bearded man standing on Scorpius with his legs
       apart, leaning east, gripping the serpent in both fists, his head in profile turned west
       towards the serpent's head. Rasalhague in the head, Cebalrai and Muliphen the east shoulder,
       kappa the west shoulder, Marfik the west elbow, Yed Prior and Yed Posterior the west fist
       (holding Serpens Caput), Sinistra the east fist (holding Serpens Cauda), Saik on the west
       thigh above the knee, Sabik the east knee, phi chi psi down the west shin, rho the west
       heel; that foot stands on the Scorpion's sloping back, touching it at the heel and the ball
       of the foot under a slightly raised arch, the toes up against the carapace. Garafsa the east
       ankle and d on the east foot. -->
