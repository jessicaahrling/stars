<svg xmlns="http://www.w3.org/2000/svg" viewBox="-245 -180 420 370">
  <!-- Centaurus, the centaur: striding east towards Lupus, his right arm stretched out to
       seize the wolf and a spear (Ptolemy's thyrsus-lance) held in his left hand, resting
       back over the horse. Menkent is the right shoulder (its name means shoulder), iota the
       left shoulder, g, i and k Cen the bearded head, nu and mu the chest, eta the right
       forearm and Ke Kwan the reaching hand. Alnair sits in the horse's breast below the
       waist, epsilon at the girth, Muhlifain, tau and e on the back. Rigil Kentaurus is the
       right fore hoof and Hadar (Agena, "knee") the left fore knee. sigma, delta and rho are
       in the haunch, o1 the near hind hoof and pi the far hind hoof kicked back; B Cen is in
       the arch of the tail. -->
