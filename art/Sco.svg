<svg xmlns="http://www.w3.org/2000/svg" viewBox="-125 -192 290 330">
  <!-- Scorpius, the scorpion (Skorpionen), seen from above: head west towards Libra, two eyes
       at the front of the carapace, the claws open, the north one raised and the south one
       lowered, four jointed legs on each side, bent at the knee and sweeping back towards the tail,
       the segmented body bending south and the jointed tail curling east and up into a round
       venom bulb and a hooked sting. Following Ptolemy: Dschubba (delta) is the forehead, Acrab
       (beta) and Fang (pi) the roots of the north and south claws, with Iklil (rho) in the south
       pincer. Alniyat (sigma), Antares (the heart) and tau lie in the body; epsilon, mu, zeta, eta
       and Sargas (theta) in the tail segments; iota and kappa in the venom bulb; Shaula and Lesath
       on the sting. -->
