<svg xmlns="http://www.w3.org/2000/svg" viewBox="-160 -230 365 450">
  <!-- Hercules (Herkules), the kneeling hero, upside down on the sky with his head by
       Ophiuchus. He kneels on his right knee, sets his left foot on the Dragon's head,
       raises his club over his head in the right hand and holds up the three-headed
       serpent Cerberus in his left fist; the lion skin is wrapped round his hips.
       Rasalgethi is his head, Kornephoros the right shoulder by the armpit, gamma the
       right upper arm, Sarin (delta) the left shoulder, lambda, mu, xi and nu the left
       arm and wrist, omicron the fist. Epsilon and zeta are his left and right side,
       pi the left hip under the lion skin, rho the left thigh, theta the left knee and
       iota the left heel; eta and sigma the right thigh, tau the right knee, phi the
       right shin and chi the right foot. -->
