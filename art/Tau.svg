<svg xmlns="http://www.w3.org/2000/svg" viewBox="-160 -165 375 330">
  <!-- Taurus, the bull: the front half of a charging bull rising out of a cloud, head lowered and
       turned to face the viewer, both horns growing from the poll and curving forward (east)
       towards Orion. Aldebaran is the southern eye, Ain (epsilon) the northern eye, gamma on the
       nostrils, theta and delta on the face. Elnath tips the northern horn and zeta the southern
       horn. The throat drops from under the jaw into the dewlap and brisket; lambda in the
       chest. Nu in the forearm of the raised near foreleg, bent at the knee with the cannon folded
       back and the cloven hoof hanging. The far foreleg reaches back with its hoof at HIP 16852.
       The Pleiades ride on the shoulder hump; omicron and xi lie just inside the cloud edge where
       the body ends. -->
