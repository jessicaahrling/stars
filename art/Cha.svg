  <!-- Chamaeleon, the chameleon (Kameleonten): as in the old atlases, a chameleon walking east
       below Musca and shooting its long tongue up towards the fly. Beta lies on the lower jaw and
       epsilon on the casque behind the turret eye, gamma high in the arched back and delta2 low on
       the belly, and the tail rolls up into its spiral through alpha and theta.
       Parts: head with casque, eye and tongue; back and tail; belly; four legs with mitten feet
       (the far pair behind); fine lines for the pupil, mouth, casque ridge, nape and flank stripe. -->
