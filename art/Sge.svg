<svg xmlns="http://www.w3.org/2000/svg" viewBox="-57 -15 68 40">
  <!-- Sagitta, the arrow (Pilen), as in Hevelius and Bode: a single arrow flying east-north-east,
       away from Hercules and over the Eagle. Gamma sits in the barbed arrowhead, delta on the
       middle of the shaft, and the two western stars are in the feathers: Sham (alpha, Arabic
       for "the arrow") in the northern vane and beta in the southern vane, just in front of
       the notched nock. Fine lines for the midrib of the head, the bindings and the barbs of
       the feathers. -->
  <g>
    <!-- the arrowhead, gamma in it -->
    <path d="M -50.4 -8.6 C -48.6 -8.8 -46 -8.8 -43.7 -8.6 C -42 -8.5 -40.5 -8.3 -38.9 -8.2 C -40 -7.6 -41 -7 -42 -6.5 L -42.9 -4.2 C -42.6 -3.1 -42.3 -1.9 -41.9 -0.8 C -43.2 -1.8 -44.4 -2.8 -45.7 -3.8 C -47.4 -5.3 -49.2 -7.2 -50.4 -8.6 Z"/>
    <!-- the shaft, delta on it, down to the notched nock -->
    <path d="M -42 -6.5 L 3.3 12.4 C 4 12.6 4.8 12.6 5.4 13 L 3.4 13.8 L 4.2 15.8 C 3.5 15.6 3 15.1 2.3 14.7 L -42.9 -4.2"/>
    <!-- the two vanes of the fletching: Sham (alpha) in the northern one, beta in the southern one -->
    <path d="M -13.2 5.5 C -10.4 6.1 -7.4 6.2 -4.6 6.3 C -2.1 6.5 0.5 6.9 2.6 7.4 C 4 7.8 5 8.2 5 8.7 C 4.1 9.6 3 10.6 2.3 12 M -14.1 7.9 C -11.7 9.4 -9.6 11.5 -7.5 13.4 C -5.6 15 -3.6 16.5 -1.7 17.8 C -0.5 18.5 0.6 18.9 0.9 18.5 C 0.9 17.3 0.9 15.8 1.3 14.3"/>
    <!-- midrib of the head; bindings behind the head and in front of the feathers -->
    <path class="fine" d="M -48.3 -7.8 L -41.9 -5.1 M -39.6 -5.5 L -40.5 -3.2 M -38.6 -5.1 L -39.6 -2.8 M -15.2 4.7 L -16.2 7 M -14.4 5 L -15.3 7.4"/>
    <!-- barbs of the feathers -->
    <path class="fine" d="M -11.2 5.9 Q -10.1 5.8 -8.4 6.2 M -8.4 7.1 Q -7 6.6 -4.9 6.5 M -5.6 8.3 Q -4 7.4 -1.6 7 M -2.3 9.6 Q -0.5 8.5 1.9 7.8 M -12.4 9 Q -11.8 9.8 -10.4 10.8 M -9.7 10.1 Q -9 11.5 -7.6 13 M -6.9 11.3 Q -6.3 13.1 -5 15 M -3.6 12.7 Q -3.1 14.8 -1.9 17"/>
  </g>
</svg>
