<svg xmlns="http://www.w3.org/2000/svg" viewBox="-149 -106 230 317">
  <!-- Puppis, the stern of the ship Argo: the raised poop deck runs aft from Regor
       (gamma2 Vel), carrying on the gunwale of Carina, to a tall stern post that rises and curls
       forward into the scroll of the aplustre; the inner line of the scroll springs from the
       throat on the inner face of the post. The aft face of the post sweeps smoothly down, clear
       of the hind foot of Canis Major, to nu, where the keel line of Carina sweeps up to meet it.
       A balustrade stands on the poop deck, its rail running from behind the after leech of the
       sail to the post, and the loom of the steering oar (its blade on Canopus in Carina) crosses
       the stern quarter over deck and rail and rises above the deck to its tiller at Naos (zeta,
       "the ship"). Tureis (rho) is the eye of the scroll and j lies on its crest; xi (Azmidi),
       omicron, kappa (Markab), p and l climb the post and pi stands in it above the poop. The rail,
       wale and strake of the hull run on from Carina as fine lines and sweep up into the post. -->
