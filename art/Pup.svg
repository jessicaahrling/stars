<svg xmlns="http://www.w3.org/2000/svg" viewBox="-159 -109 283 316">
  <!-- Puppis, the stern of the ship Argo, lying tilted as in the old atlases: the broken-off
       forward end of the hull sinks to the south-east towards Vela and Carina, and the stern
       sweeps up in the north into a tall post that curls over eastwards into a scroll (the
       aphlaston). A railing runs along the gunwale, and the steering oar hangs from the stern
       quarter with its tiller above the rail and its blade down past the stern to the south-west.
       Tureis (ρ, "the little shield") sits in the heart of the scroll and j on its crest;
       Azmidi (ξ), ο, Markab (κ), l and p climb the stern post; Naos (ζ, "the ship") is on
       the hull side and Regor (γ2 Vel) low on the broken forward end; π is on the oar's
       loom and ν where its blade begins. -->
