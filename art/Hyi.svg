<svg xmlns="http://www.w3.org/2000/svg" viewBox="-69 -121 148 221">
  <!-- Hydrus, the lesser water snake (Lilla vattenormen), seen from above as it winds across
       the southern sky between the two Magellanic Clouds. Its head is raised in the north, just
       south-east of Achernar at the end of the river Eridanus, forked tongue out; alpha, the
       traditional "head of Hydrus", sits on the crown behind the eyes. The neck hangs straight
       down to eta2 and turns east along delta and epsilon, the body runs south-east to the
       hairpin bend at gamma, then swings back west in a long, shallow S, and the tail tapers
       through beta, the brightest star, and flicks up at its tip. A belly line runs along one side. -->
