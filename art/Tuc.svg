<svg xmlns="http://www.w3.org/2000/svg" viewBox="-95 -100 215 145">
  <!-- Tucana, the toucan (after Bode's Uranographia): perched on a branch and facing west,
       body leaning forward and tail hanging down to the south-east, with a fruiting twig
       held in its huge bill (Keyser and de Houtman drew it with a twig in its beak).
       Gamma is the eye, alpha the tip of the bill, beta1 on the folded wing tip over the
       rump, zeta on the flank by the vent and epsilon low on the belly above the legs.
       Delta is the fruit hanging from the twig. -->
