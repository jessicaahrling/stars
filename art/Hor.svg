<svg xmlns="http://www.w3.org/2000/svg" viewBox="-130 -124 242 240">
  <!-- Horologium (Pendeluret), Lacaille's pendulum clock with a seconds hand (l'Horloge a
       pendule et a secondes), drawn after his 1756 planisphere: a clock plate with a large
       dial, the pendulum and two driving weights hanging out of its lower edge. The clock
       hangs upside down on the sky, its top towards Hydrus and its pendulum reaching
       north-east. Iota and beta sit on two opposite corners of the plate; the other two
       corners are rounded off so the plate stays inside the narrow constellation. Zeta and
       mu sit on the hour ring, eta on the plate beside the dial, and alpha, the brightest
       star, in the pendulum bob (as in Bode's Uranographia). Rod and weight cords hang
       parallel, in one plumb line, with the plate a little askew on its nail. -->
