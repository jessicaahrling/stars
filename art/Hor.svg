  <!-- Horologium (Pendeluret), Lacaille's pendulum clock with a seconds hand (l'Horloge a
       pendule et a secondes), drawn after his 1756 planisphere: a square clock plate with a
       large dial, the pendulum and two driving weights hanging out of its lower edge. The
       clock hangs upside down on the sky, its top towards Hydrus and its pendulum reaching
       north-east. Iota and beta sit on two opposite corners of the plate, zeta and mu on the
       hour ring near eight and three o'clock, eta on the plate beside the dial, and alpha, the
       brightest star, in the pendulum bob (as in Bode's Uranographia), the pendulum caught
       a little out of plumb in mid-swing beside the plumb weight cords. -->
