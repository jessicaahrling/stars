<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -42 70 82">
  <!-- Crux (Södra korset), the Southern Cross, as Royer and Bode drew it: a Latin cross
       standing upright with its long foot to the south. Gacrux (gamma) sits in the head of
       the cross, Acrux (alpha) in the foot, Mimosa (beta) in the eastern arm and Imai (delta)
       in the western arm. The arms follow the stars, so the crossbar is tipped a little.
       Fine lines for the bevel round the raised face and a round boss where the beams cross. -->
