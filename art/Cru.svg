    <path class="fine" d="M -11 -34.9 L -9.2 -33.4 M -1.4 -35.9 L -2.8 -34.1 M 0.7 -15.5 L -0.7 -13.5 M 18.7 -19.8 L 17.5 -17.9 M 21 -10.5 L 19 -11.7 M 1.7 -5.8 L 0 -7.1 M 5.8 33.3 L 4 31.8 M -3.8 34.3 L -2.4 32.5 M -7.7 -3.5 L -6.3 -5.5 M -29.1 1.7 L -27.9 -0.3 M -31.4 -7.7 L -29.4 -6.5 M -8.7 -13.2 L -7 -11.9"/>
    <path class="fine" d="M -3.5 -11.9 C -2.2 -11.9 -1.1 -10.8 -1.1 -9.5 C -1.1 -8.2 -2.2 -7.1 -3.5 -7.1 C -4.8 -7.1 -5.9 -8.2 -5.9 -9.5 C -5.9 -10.8 -4.8 -11.9 -3.5 -11.9 Z"/>
  </g>
</svg>
