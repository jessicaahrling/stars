<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -42 70 82">
  <!-- Crux (Södra korset), the Southern Cross, as Royer and Bode drew it: a square-cut Latin
       cross standing upright with its long foot to the south, the whole cross tipped about
       9 degrees so that its beams lie along the stars. Gacrux (gamma) sits in the head of the
       cross, Acrux (alpha) in the foot, Mimosa (beta) in the eastern arm and Imai (delta) in
       the western arm. Fine lines for the bevel round the raised face and a round boss where
       the beams cross. -->
  <g>
    <path d="M -12.8 -34.2 L -3.4 -35.7 L 0 -14.8 L 19.6 -17.9 L 21.1 -8.4 L 1.5 -5.3 L 7.6 32.6 L -1.8 34.1 L -7.9 -3.8 L -29.1 -0.4 L -30.6 -9.8 L -9.5 -13.2 Z"/>
    <path class="fine" d="M -11 -32.9 L -4.7 -33.9 L -1.3 -12.9 L 18.2 -16.1 L 19.3 -9.8 L -0.3 -6.6 L 5.8 31.3 L -0.5 32.3 L -6.6 -5.6 L -27.7 -2.2 L -28.8 -8.5 L -7.6 -11.9 Z"/>
    <path class="fine" d="M -4 -11.7 C -2.6 -11.7 -1.6 -10.6 -1.6 -9.3 C -1.6 -7.9 -2.6 -6.9 -4 -6.9 C -5.3 -6.9 -6.4 -7.9 -6.4 -9.3 C -6.4 -10.6 -5.3 -11.7 -4 -11.7 Z"/>
  </g>
</svg>
