    <path d="M -11 -34.9 L -1.4 -35.9 L 0.7 -15.5 L 18.7 -19.8 L 21 -10.5 L 1.7 -5.8 L 5.8 33.3 L -3.8 34.3 L -7.7 -3.5 L -29.1 1.7 L -31.4 -7.7 L -8.7 -13.2 Z"/>
