    <path d="M 181 -68.5 C 188 -62.5 198 -53 204 -45 C 207 -41 210 -40 214 -43 C 222 -48 233 -47 239 -42 C 246 -36 248 -27 244 -18 C 240 -10 232 -6 222 -6 C 216 -6 211 -9 207 -12 C 188 -17 166 -21 152 -22 C 145 -22.5 136 -17 128 -13"/>
    <!-- far foreleg, planted, hanging from the belly behind the elbow -->
    <path d="M 177 -18 C 180 -2 182 12 184 25 C 185 31 190 35 195 39 C 201 44 200 52 192 54 C 182 56 166 55 158 52 C 152 50 149 45 149 39 C 149 30 144 10 136 -1 C 133 -6 131 -10 128 -13"/>
    <path class="fine" d="M 134.7 -16.5 C 131 -32 116 -56 112 -72 C 108 -100 98 -128 78 -147 M 243.8 -35.9 L 251.8 -38.9 M 246 -27 L 254 -27 M 243.6 -17.3 L 250.6 -13.3 M 197.8 42.3 L 204.8 40.3 M 198.8 47.6 L 205.8 48.6 M 196 52.2 L 201 56.2"/>
  </g>
  <g>
    <!-- belly -->
    <path d="M 128 -13 C 100 -7 70 -1 48 3 C 30 7 10 14 -5 20"/>
    <!-- near hind leg and haunch: thigh at chi, shin narrowing to the heel, flat paw at nu and xi -->
    <path d="M -5 20 C -12 28 -16 36 -16 46 C -14 62 -9 80 -6 96 C -3 112 0 126 3 138 C 5 148 7 155 11 163 C 15 171 25 178 29 187 C 32 196 26 202 16 203 C 4 204 -14 203 -26 200 C -34 198 -40 192 -40 183 C -40 175 -36 168 -33 160 C -31 154 -30 146 -31 138 C -33 124 -44 104 -56 84 C -63 72 -76 48 -84 30 C -94 14 -104 -10 -104 -30 C -104 -40 -103 -46 -102 -51"/>
    <!-- far hind leg: thick thigh at psi, narrowing to the hock, paw at lambda and mu -->
    <path d="M 48 3 C 50 20 54 34 60 43 C 66 51 78 56 88 60 C 93 62 98 62 103 60 C 108 57 112 55 117 55 C 127 55 133 63 132 73 C 131 84 125 91 116 92 C 96 91 50 86 -11.4 71"/>
