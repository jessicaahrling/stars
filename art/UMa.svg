<svg xmlns="http://www.w3.org/2000/svg" viewBox="-265 -215 530 430">
  <!-- Ursa Major, the great bear: striding west, near forepaw reaching out, far forepaw planted,
       with its long classical tail streaming east. Muscida on the muzzle, h in the neck, upsilon in
       the chest, Dubhe on the back, Merak in the loins, Phecda in the thigh, Megrez at the root of
       the tail, Alioth, Mizar and Alkaid along the tail. phi in the shoulder, theta in the near
       foreleg, Talitha and Alkaphrah in its paw; chi and nu-xi on the near hind leg and paw, psi and
       lambda-mu on the far hind leg and paw. -->
  <g>
    <!-- back -->
    <path d="M -86 -94 C -76 -97 -50 -112 -30 -117 C -10 -122 12 -125 30 -128 C 46 -133 56 -147 70 -152 C 80 -155 90 -157 98 -162"/>
