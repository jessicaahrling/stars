<svg xmlns="http://www.w3.org/2000/svg" viewBox="-25 -55 175 95">
  <!-- Vulpecula cum Ansere, the little fox with the goose (Räven), after Hevelius and Bode:
       the fox trots west under Cygnus with the goose held in its open jaws and its brush held out
       behind. The jaws grip the goose at the base of its neck; the neck arches through the gape and
       hangs limp from the front of the mouth, the head turned so the bill points east. Anser (alpha)
       sits on the goose's body, 1 Vul in its head, 13 Vul on the fox's haunch, 15 Vul at the root of
       the tail and 23 Vul near the white tail tip. The ears are laid flat back along the head, tucked
       under the swan's throat, south of the Cygnus border. -->
