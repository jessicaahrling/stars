    <path d="M 33.1 -4.4 C 30.2 -0.8 27.2 3.2 25.4 6.8 C 24.8 8 24.5 9.2 24.6 10.4 C 24.9 13.2 25.2 15.8 25.3 17.8 C 25.4 19.4 26.4 20.1 28.2 20.1 C 30.2 20.1 32.6 19.6 31.1 17.8 C 30.1 16.4 29.8 14.4 30 12.8 C 30.3 10.2 32.4 7 35.8 3.6"/>
