       behind. The jaws grip the goose at the base of its neck; the limp neck hangs out of the front
       of the mouth. Anser (alpha) sits on the goose's body, 1 Vul on its dangling head, 13 Vul on the
       fox's haunch, 15 Vul at the root of the tail and 23 Vul near the white tail tip. -->
