  <!-- Antlia, Lacaille's air pump (la Machine Pneumatique): an 18th-century double-barrel
       air pump standing on its table. Two brass barrels under a cross-head, their racks
       worked by a pinion and a rocking winch handle; alpha sits in the hub of the winch.
       A pipe with a stopcock leads west to the brass plate with the glass bell-jar
       receiver; epsilon lies in the plate at the foot of the jar. East of the pump stands
       the mercury gauge, and iota sits in the top of the table's east leg. -->
