<svg xmlns="http://www.w3.org/2000/svg" viewBox="-73 -76 73 82">
  <!-- Norma (Vinkelhaken), Lacaille's l'Equerre et la Regle (Norma et Regula): a joiner's try
       square lying on the sky with a straight rule laid across it, drawn flat. The heel of the
       square, where the riveted wooden stock meets the steel blade, is at epsilon; the blade runs
       north-west to its tip at delta, the stock south-west to its square end at gamma2. The rule
       passes under the blade just short of its tip and runs south past eta, which lies on the rule. -->
  <g>
    <!-- the wooden stock of the try square: heel at epsilon, square end at gamma2 -->
    <path d="M -63.8 -32.5 L -54.2 -39.7 L -32.6 -10.9 L -42.2 -3.7 Z"/>
    <!-- the steel blade, out to its tip at delta -->
    <path d="M -54.2 -39.7 L -19.5 -65.9 L -16.1 -61.5 L -50.9 -35.3"/>
    <!-- the rule (Regula), lying under the blade and running south through eta -->
    <path d="M -26.7 -60.4 L -29.3 -67.4 L -34 -65.6 L -30.9 -57.3"/>
    <path d="M -24.7 -55.1 L -8.2 -10.6 L -12.9 -8.9 L -28.9 -51.9"/>
    <!-- two brass rivets in the stock -->
    <path class="fine" d="M -50.6 -26.9 C -50.6 -26.1 -51.3 -25.4 -52.1 -25.4 C -52.9 -25.4 -53.6 -26.1 -53.6 -26.9 C -53.6 -27.7 -52.9 -28.4 -52.1 -28.4 C -51.3 -28.4 -50.6 -27.7 -50.6 -26.9 Z M -44.3 -18.5 C -44.3 -17.7 -45 -17 -45.8 -17 C -46.6 -17 -47.3 -17.7 -47.3 -18.5 C -47.3 -19.3 -46.6 -20 -45.8 -20 C -45 -20 -44.3 -19.3 -44.3 -18.5 Z"/>
    <!-- graduations on the blade, kept clear of the crossing, and along the rule -->
    <path class="fine" d="M -49.4 -43.3 L -48.2 -41.7 M -44.6 -46.9 L -43.4 -45.3 M -39.8 -50.5 L -38.6 -49 M -35 -54.2 L -33.8 -52.6"/>
    <path class="fine" d="M -23 -50.5 L -24.9 -49.8 M -19.9 -42.1 L -21.7 -41.4 M -16.7 -33.6 L -18.6 -32.9 M -13.6 -25.2 L -15.5 -24.5"/>
    <!-- hanging hole in the rule -->
    <path class="fine" d="M -10.2 -12.9 C -10.2 -12.1 -10.9 -11.4 -11.7 -11.4 C -12.5 -11.4 -13.2 -12.1 -13.2 -12.9 C -13.2 -13.7 -12.5 -14.4 -11.7 -14.4 C -10.9 -14.4 -10.2 -13.7 -10.2 -12.9 Z"/>
  </g>
</svg>
