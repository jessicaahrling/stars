<svg xmlns="http://www.w3.org/2000/svg" viewBox="-73 -76 73 82">
  <!-- Norma (Vinkelhaken), Lacaille's l'Equerre et la Regle (Norma et Regula): a joiner's try
       square lying on the sky with a straight rule laid across it. The heel of the square, where
       the wooden stock meets the steel blade, is at epsilon; the blade runs north-west to its tip
       at delta, the stock south-west to its end at gamma2. The rule crosses the blade just short
       of its tip and runs south past eta, which lies on the rule. -->
  <g>
    <!-- the wooden stock of the try square: heel at epsilon, end at gamma2 -->
    <path d="M -63.8 -32.5 L -54.2 -39.7 L -33.1 -11.7 L -33.4 -9.6 L -40.6 -4.2 L -42.7 -4.5 Z"/>
    <path d="M -33.4 -9.6 L -34.2 -8.2 L -41.4 -2.8 L -43.5 -3.1 L -64.6 -31.1 L -63.8 -32.5"/>
    <!-- the steel blade, out to its tip at delta -->
    <path d="M -54.2 -39.7 L -19.5 -65.9 L -16.1 -61.5 L -50.9 -35.3"/>
    <!-- the rule (Regula), lying under the blade and running south through eta -->
    <path d="M -26.7 -60.4 L -29.3 -67.4 L -34 -65.6 L -30.9 -57.3"/>
    <path d="M -24.7 -55.1 L -8.2 -10.6 L -12.9 -8.9 L -28.9 -51.9"/>
    <path d="M -34 -65.6 L -34.4 -64.8 L -31.4 -56.9"/>
    <path d="M -8.2 -10.6 L -8.6 -9.9 L -13.3 -8.1 L -29.4 -51.5"/>
    <!-- brass face plate and rivets on the stock, corners of its end face -->
    <path class="fine" d="M -52.2 -34.3 L -34.6 -11 M -51.7 -26.4 C -51.7 -25.9 -52.2 -25.4 -52.7 -25.4 C -53.3 -25.4 -53.7 -25.9 -53.7 -26.4 C -53.7 -27 -53.3 -27.4 -52.7 -27.4 C -52.2 -27.4 -51.7 -27 -51.7 -26.4 Z M -45.4 -18 C -45.4 -17.5 -45.8 -17 -46.4 -17 C -47 -17 -47.4 -17.5 -47.4 -18 C -47.4 -18.6 -47 -19 -46.4 -19 C -45.8 -19 -45.4 -18.6 -45.4 -18 Z M -40.6 -4.2 L -41.4 -2.8 M -42.7 -4.5 L -43.5 -3.1"/>
    <!-- graduations on the blade and along the rule -->
    <path class="fine" d="M -51 -42.1 L -50.3 -41.2 M -47.8 -44.5 L -46.5 -42.8 M -44.6 -46.9 L -43.9 -46 M -41.4 -49.3 L -40.1 -47.6 M -38.2 -51.7 L -37.5 -50.8 M -35 -54.1 L -33.7 -52.4 M -31.8 -56.6 L -31.1 -55.6 M -28.7 -59 L -27.3 -57.2 M -25.5 -61.4 L -24.7 -60.4 M -27.7 -63.1 L -28.7 -62.8 M -23 -50.5 L -24.9 -49.8 M -21.4 -46.3 L -22.5 -45.9 M -19.9 -42.1 L -21.7 -41.4 M -18.3 -37.8 L -19.3 -37.4 M -16.7 -33.6 L -18.6 -32.9 M -15.2 -29.4 L -16.2 -29 M -13.6 -25.2 L -15.5 -24.5 M -10.5 -16.7 L -12.3 -16"/>
    <!-- hanging hole in the rule -->
    <path class="fine" d="M -10.6 -12.9 C -10.6 -12.3 -11.1 -11.8 -11.7 -11.8 C -12.3 -11.8 -12.8 -12.3 -12.8 -12.9 C -12.8 -13.5 -12.3 -14 -11.7 -14 C -11.1 -14 -10.6 -13.5 -10.6 -12.9 Z"/>
  </g>
</svg>
