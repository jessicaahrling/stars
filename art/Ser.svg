<svg xmlns="http://www.w3.org/2000/svg" viewBox="-298 -187 535 407">
  <!-- Serpens, the serpent (Ormen), in its two parts, with Ophiuchus holding it in both fists.
       Serpens Caput (west): the snake rears up out of Ophiuchus' west fist (Yed Prior) towards
       Corona Borealis, its broad viper head seen from above with the forked tongue out.
       Gudja (kappa) is its east eye, mirrored by the west eye across the head's axis; gamma
       and Nasak Shamiya (beta) lie at the back of the head and iota on the round snout.
       The neck winds down through Nasak Yamani (delta), Unukalhai ("the serpent's neck",
       alpha) and epsilon, the body sways in a gentle S past mu and bends east into the fist.
       Serpens Cauda (east): the body comes out from behind Ophiuchus' east knee (Sabik), sags
       through xi and omicron into his east fist (Sinistra, tau Oph), and the tail rises from
       the fist through eta to its tip at Alya (theta, "the tail"). The cut ends follow the
       outlines of his fists and leg, where the middle of the snake is hidden.
       Belly scales run along one side. -->
