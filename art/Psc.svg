<svg xmlns="http://www.w3.org/2000/svg" viewBox="-273 -198 502 359">
  <!-- Pisces, the two fishes tied together by their tails with a long cord.
       The western fish swims west under Pegasus with its mouth at Fumalsamakah (β),
       γ and 7 Psc on its head, θ and ι on its back, κ and λ on its belly (the Circlet)
       and ω on its tail. The northern fish swims north beside Andromeda with τ on its
       head just behind the open mouth, υ and φ on its belly and χ near its forked tail.
       The cord runs from the western fish's tail through δ, ε, ζ, μ, ν and ξ to the knot
       at Alrescha (α, "the cord"), then north through Torcular (ο) and Alpherg (η) and
       is tied in the fork of the northern fish's tail. -->
