<svg xmlns="http://www.w3.org/2000/svg" viewBox="-255 -180 441 370">
  <!-- Pegasus, the winged horse: the front half of the horse, upside down on the sky as in the
       classical atlases, leaping west with both forelegs stretched out and the wing raised and spread
       from its back towards the south. The Great Square is the barrel: Markab on the withers at the root
       of the neck, Scheat at the top of the far (right) foreleg, Alpheratz the navel on the belly
       (shared with Andromeda's head) and Algenib on the back by the slanting cut where the body ends.
       Xi and Homam on the neck, Biham on the forehead and Enif the muzzle. Matar the right knee and pi
       the right fetlock; Sadalbari and Sadalnazi on the breast at the near (left) shoulder, iota the
       left knee and kappa the left fetlock. -->
  <!-- crest of the neck, from the withers (Markab) to the poll -->
  <path d="M -90 46 C -80.6 51.6 -74.4 57.5 -66 64.5 C -55.3 73.5 -47.8 81.6 -37 90.5 C -25.8 99.8 -17 106.9 -5 115 C 6.4 122.7 15.7 128.1 28 134.2 C 39.1 139.7 48.6 142.2 60 147"/>
  <!-- head: ears, forehead (Biham), muzzle (Enif), jaw, soft throatlatch -->
