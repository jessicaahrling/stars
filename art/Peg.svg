  <!-- barrel: belly (Alpheratz at the navel), slanting cut where the body ends (Algenib), back -->
  <path d="M -56 -116.5 C -64.1 -118.4 -70 -121.3 -78 -123.5 C -90.1 -126.8 -99.6 -129.6 -112 -131.5 C -124.8 -133.4 -135 -133.9 -148 -134 C -161 -134.1 -174 -132.6 -186 -131.6 C -192.5 -131.1 -198.5 -131.4 -199.5 -127.5 C -203.6 -107 -213.5 -62 -218.5 -38 C -223.5 -13 -227.5 8 -229.5 22 C -230.5 30 -228 36.5 -221 38.6 C -215.5 40.3 -209.5 42 -203 42.4 C -198.3 42.5 -194.7 42 -190 41.6 C -178.1 40.5 -168.9 39.3 -157 38.3 C -150.2 37.7 -144.8 37.1 -138 37.3 C -130.4 37.5 -124.5 38.2 -117 39.3 C -110.6 40.2 -105.7 41.4 -99.5 43 C -96 43.9 -93.1 44.2 -90 46"/>
