<svg xmlns="http://www.w3.org/2000/svg" viewBox="-43 -71 90 133">
  <!-- Scutum (Skölden), Scutum Sobiescianum: the shield of King Jan III Sobieski as Hevelius
       drew it, a tall heater shield with a raised rim, emblazoned with a cross for his defence of
       Christendom at Vienna in 1683. It is tipped along the line of its stars, top to the
       north-east and point to the south-west. Beta sits in the top of the shield just above the
       head of the cross, alpha and delta on the two arms of the crossbar, and gamma in the point
       of the shield. -->
  <!-- the shield and its rim -->
  <path d="M -38.6 -47.8 Q -16.5 -61 8.7 -66.9 C 25.6 -26.3 42.5 20.8 31.3 57.2 C -2 38.8 -22.6 -6.8 -38.6 -47.8 Z"/>
  <path d="M -34 -45.8 Q -15 -57.5 6.8 -62.3 C 22.3 -24.9 37.3 18.6 29.1 51.6 C 0.2 33.6 -19.2 -8.1 -34 -45.8 Z"/>
  <!-- the cross formée, with a bevel round its raised face -->
  <path d="M -1.6 -14.2 Q -9.7 -34.1 -18.8 -45.5 L -4 -51.5 Q -2.6 -37 5.4 -17 Q 10.7 -19.2 18 -25 L 22.9 -13 Q 13.6 -12.1 8.3 -10 Q 19.5 17.7 26.5 27.8 L 14.4 32.7 Q 12.4 20.6 1.2 -7.1 Q -4.1 -5 -11.4 0.9 L -16.3 -11.2 Q -6.9 -12.1 -1.6 -14.2 Z"/>
  <path class="fine" d="M 0.2 -13.4 Q -7.9 -33.3 -16.7 -44.9 L -5 -49.6 Q -3.4 -35.1 4.6 -15.2 Q 9.9 -17.3 17.3 -23 L 21 -14 Q 11.7 -12.9 6.4 -10.8 Q 17.6 17 24.5 27.2 L 15.4 30.8 Q 13.2 18.8 2 -9 Q -3.3 -6.8 -10.7 -1.1 L -14.4 -10.2 Q -5.1 -11.3 0.2 -13.4 Z"/>
</svg>
