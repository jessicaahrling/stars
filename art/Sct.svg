<svg xmlns="http://www.w3.org/2000/svg" viewBox="-43 -65 90 127">
  <!-- Scutum (Skölden), Scutum Sobiescianum: the shield of King Jan III Sobieski as Hevelius
       drew it, a tall heater shield with a raised rim, emblazoned with a cross for his defence of
       Christendom at Vienna in 1683. It is tipped along the line of its stars, top to the
       north-east and point to the south-west; its arched top is canted a little so the upper
       corner stays inside the boundary. Beta sits in the open field at the top of the shield,
       above the head of the cross, alpha and delta on the two arms of the crossbar, a small boss
       at the crossing, and gamma in the point of the shield. -->
  <!-- the shield and its rim -->
  <path d="M -39.1 -48.9 Q -22.5 -62.6 7.6 -60.7 C 26.1 -26.5 42.5 20.8 31.3 57.2 C -2 38.8 -23.1 -6.6 -39.1 -48.9 Z"/>
  <path d="M -34.7 -47.7 C -25.3 -55.5 -6.5 -57.9 5.3 -57.1 C 14.3 -40.5 22.5 -20 27 -1.7 C 30.5 12.8 33.5 37.5 29.1 51.7 C 15.9 44.5 0.5 24 -7.2 11.2 C -18.1 -6.8 -27.2 -28.1 -34.7 -47.7 Z"/>
  <!-- the cross formée -->
  <path d="M -2.2 -14.4 Q -9.6 -32.8 -17.1 -42.7 L -3.2 -48.3 Q -1.8 -35.9 5.6 -17.6 Q 10.5 -19.6 16.2 -24.3 L 21 -12.3 Q 13.7 -11.8 8.8 -9.8 Q 19.8 17.6 26.5 27.8 L 14.3 32.7 Q 12 20.7 1 -6.6 Q -3.9 -4.6 -9.6 0.1 L -14.4 -11.9 Q -7.1 -12.4 -2.2 -14.4 Z"/>
  <!-- a small round boss at the crossing -->
  <path class="fine" d="M 2.3 -14.7 C 3.7 -15.3 5.3 -14.6 5.9 -13.1 C 6.5 -11.7 5.8 -10.1 4.3 -9.5 C 2.9 -8.9 1.3 -9.6 0.7 -11.1 C 0.1 -12.5 0.8 -14.1 2.3 -14.7 Z"/>
</svg>
