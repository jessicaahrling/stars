<svg xmlns="http://www.w3.org/2000/svg" viewBox="-46 -35 62 90">
  <!-- Equuleus, the little horse (Lilla hästen): only the head and a short piece of the neck,
       cut off as in the classical atlases (Ptolemy's "forepart of a horse"). The foal throws
       its head up: muzzle to the north, face turned west, long pointed ears laid back towards
       the west-south-west, and the arched neck bending back from the head towards the jaw side
       (south-east), cut off on the diagonal. Following Ptolemy, the two northern stars are in
       the mouth: gamma on the upper lip by the nostril, delta on the small lower lip and chin.
       Kitalpha ("the part of the horse") is in the head at the poll, just behind the roots of
       the ears. -->
  <!-- near ear, rising from the poll -->
  <path d="M -11.5 31.5 C -9 32.8 -5.2 36.5 2.5 36.5 C 1.1 34.9 -0.7 33.1 -2.6 31.6"/>
  <!-- far ear, half hidden behind the near one, running into the forehead -->
  <path d="M -2.6 31.6 C -0.9 32.1 1.1 32.4 3.4 32.4 C 0.8 29.2 -6.4 25.9 -7.4 23.3"/>
  <!-- forehead, face and nose to the upper lip -->
  <path d="M -7.4 23.3 C -7.1 22.1 -6.5 21.1 -6 19.9 C -5.3 18.6 -4.5 17.4 -4.1 16 C -3.5 14.2 -3.3 12.3 -3 10.5 C -2.5 8 -2.1 5.5 -1.5 3 C -0.9 0.3 -0.2 -2.4 0.6 -5.1 C 1.3 -7.5 2.2 -9.8 3 -12.2 C 3.6 -14.3 4.2 -16.6 4.5 -18.9 C 4.8 -21.1 4.9 -23.3 4.6 -25.1 C 4.3 -26.8 3.2 -27.8 1.6 -28.1 C -0.3 -28.4 -2.6 -28.3 -4.4 -27.1"/>
  <!-- small lower lip, round chin, lower jaw, the round jowl and the throat-latch -->
  <path d="M -4.4 -27.1 C -5.3 -27.5 -6.6 -27.6 -7.8 -27.3 C -9.1 -27 -10 -26 -10.4 -24.7 C -10.8 -23.3 -11 -21.9 -11.7 -20.5 C -14.6 -15.2 -18.8 -8.6 -23.2 -3.4 C -27.2 0.6 -32.8 1.2 -33 6.5 C -33.2 11 -30.8 14.8 -28.2 17.6 C -27.2 18.7 -26.8 20 -27 21.4"/>
  <!-- throat -->
  <path d="M -27 21.4 C -27.4 27 -29 34.2 -31.8 39.6"/>
  <!-- arched crest of the neck -->
  <path d="M -11.5 31.5 C -10.1 38.1 -10.5 42.4 -15.4 45.8"/>
  <!-- where the neck is cut off -->
  <path d="M -15.4 45.8 C -20.9 44.3 -26.4 42.1 -31.8 39.6"/>
  <!-- front edge of the near ear, where it covers the far one -->
  <path class="fine" d="M -2.6 31.6 C -4.2 30.2 -5.9 29 -7.6 28"/>
  <!-- eye -->
  <path class="fine" d="M -10.8 14.8 C -10 14.6 -9.2 14 -8.8 13.2 C -8.4 12.3 -8.5 11.3 -8.6 10.3 C -8.6 9.8 -8.9 9.4 -9.2 9.1 C -10.2 9.5 -11.1 10.4 -11.3 11.5 C -11.6 12.6 -11.4 13.9 -10.8 14.8"/>
  <!-- nostril, mouth, cheek -->
  <path class="fine" d="M -0.6 -17 C 0.2 -18.1 0.7 -19.4 0.8 -20.6 C 0.9 -21.6 1.8 -22 2.3 -21.3 C 2.6 -20.8 2.3 -20.2 1.7 -20.2 M -4.4 -27.1 C -5 -25.8 -5.5 -24.5 -5.8 -23.2 C -5.9 -22.6 -5.8 -22 -5.4 -21.7 M -13.9 10.3 C -13 7.9 -12.4 5.5 -12.1 3 C -11.9 1.1 -11.7 -0.9 -12.3 -2.7 C -12.8 -4 -13.9 -5.1 -15.2 -5.6 C -16.3 -5.9 -17.5 -5.9 -18.5 -5.5"/>
</svg>
