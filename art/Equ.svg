<svg xmlns="http://www.w3.org/2000/svg" viewBox="-46 -35 62 90">
  <!-- Equuleus, the little horse (Lilla hästen): only the head and a short piece of the neck,
       cut off as in the classical atlases (Ptolemy's "forepart of a horse"). The foal throws
       its head up: muzzle to the north, face turned west, ears pricked to the west, and the
       neck bending back from the head towards the jaw side (south-east), as a horse's neck
       does, with the cut-off on the diagonal. Following Ptolemy, the two northern stars are
       in the mouth: gamma on the upper lip by the nostril, delta on the small lower lip and
       chin. Kitalpha ("the part of the horse") is in the head at the poll, just behind the
       roots of the ears. -->
  <!-- ears: the far one peeping out behind the near one -->
  <path d="M -10.4 30 C -9.9 30.2 -9.4 30.4 -8.9 30.6 C -8.2 30.8 -7.5 31 -6.8 31.2 C -6 31.4 -5.3 31.5 -4.5 31.6 C -3.7 31.7 -2.9 31.6 -2.1 31.6 C -1.5 31.6 -0.8 31.6 -0.2 31.5 C 0.2 31.4 0.7 31.3 1.1 31.2 C 0.9 30.9 0.7 30.6 0.4 30.3 C 0 29.9 -0.4 29.5 -0.9 29.1 C -1.2 28.9 -1.4 28.7 -1.7 28.5"/>
  <path d="M -1.7 28.5 C -1.2 28.5 -0.6 28.5 -0.1 28.4 C 0.6 28.3 1.3 28.3 2 28.1 C 2.5 28 2.9 27.8 3.4 27.6 C 3.1 27.3 2.8 27 2.5 26.7 C 2 26.3 1.5 25.9 1 25.6 C 0.3 25.1 -0.4 24.7 -1.1 24.3 C -1.8 23.9 -2.5 23.6 -3.3 23.4 C -4.1 23.1 -4.9 22.9 -5.7 22.8 C -6.3 22.7 -7 22.8 -7.6 22.8"/>
  <!-- forehead, face and nose to the upper lip -->
  <path d="M -7.6 22.8 C -7 21.9 -6.5 20.9 -6 19.9 C -5.3 18.6 -4.5 17.4 -4.1 16 C -3.5 14.2 -3.3 12.3 -3 10.5 C -2.5 8 -2.1 5.5 -1.5 3 C -0.9 0.3 -0.2 -2.4 0.6 -5.1 C 1.3 -7.5 2.2 -9.8 3 -12.2 C 3.5 -13.8 4.3 -15.3 4.7 -17 C 5.1 -18.5 5.3 -20 5.2 -21.5 C 5.1 -22.9 4.8 -24.3 4.2 -25.5 C 3.6 -26.5 2.7 -27.3 1.7 -27.8 C 0.9 -28.2 -0.2 -28.3 -1 -28.1 C -2 -27.8 -2.8 -27.1 -3.3 -26.4 C -3.7 -25.9 -3.9 -25.4 -4 -24.9"/>
  <!-- small lower lip, round chin, lower jaw and the round jowl -->
  <path d="M -4 -24.9 C -4.5 -25.4 -5.1 -25.6 -5.8 -25.6 C -6.7 -25.6 -7.6 -25.4 -8.3 -25 C -9 -24.6 -9.5 -24 -9.8 -23.2 C -10.6 -21 -11.9 -18.7 -13.3 -16.4 C -14.5 -14.2 -15.9 -12 -17.3 -10 C -18.8 -7.8 -20.4 -5.8 -22.1 -3.8 C -23.4 -2.3 -24.8 -0.8 -26.3 0.6 C -27.6 1.8 -29.2 2.6 -30.2 4 C -31 5.2 -31.6 6.7 -31.6 8.1 C -31.6 9.5 -30.9 10.8 -30 11.9 C -29.1 13 -27.9 13.8 -26.5 14.2"/>
  <!-- throat -->
