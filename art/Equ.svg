<svg xmlns="http://www.w3.org/2000/svg" viewBox="-46 -35 62 90">
  <!-- Equuleus, the little horse (Lilla hästen): only the head and a short piece of the neck,
       cut off as in the classical atlases (Ptolemy's "forepart of a horse"). The foal throws
       its head up: muzzle to the north, face turned west, leaf-shaped ears pricked to the west
       and laid a little back, and the neck bending back from the head towards the jaw side
       (south-east), as a horse's neck does, with the cut-off on the diagonal. Following
       Ptolemy, the two northern stars are in the mouth: gamma on the upper lip by the nostril,
       delta on the small lower lip and chin. Kitalpha ("the part of the horse") is in the head
       at the poll, just behind the roots of the ears. -->
  <!-- near ear, rising from the rounded poll -->
  <path d="M -10 33.8 C -9.9 32.7 -9.1 30.6 -8.4 31.4 C -6.2 34.1 -1.6 36.7 3 36.6 C 1.7 33.2 -1 30.3 -3.8 28.9"/>
  <!-- far ear, peeping out ahead of it -->
  <path d="M -3.8 28.9 C -1.7 29.4 0.7 29.5 2.9 29 C 0.6 25 -4 22.5 -7.6 22.8"/>
  <!-- forehead, face and nose to the upper lip -->
  <path d="M -7.6 22.8 C -7 21.9 -6.5 20.9 -6 19.9 C -5.3 18.6 -4.5 17.4 -4.1 16 C -3.5 14.2 -3.3 12.3 -3 10.5 C -2.5 8 -2.1 5.5 -1.5 3 C -0.9 0.3 -0.2 -2.4 0.6 -5.1 C 1.3 -7.5 2.2 -9.8 3 -12.2 C 3.5 -13.8 4.3 -15.3 4.7 -17 C 5.1 -18.5 5.3 -20 5.2 -21.5 C 5.1 -22.9 4.8 -24.3 4.2 -25.5 C 3.6 -26.5 2.7 -27.3 1.7 -27.8 C 0.9 -28.2 -0.2 -28.3 -1 -28.1 C -2.2 -27.9 -3.4 -27.2 -4.4 -26.2"/>
  <!-- small lower lip, round chin, lower jaw and the round jowl -->
  <path d="M -4.4 -26.2 C -5.4 -26.6 -6.5 -27 -7.7 -26.8 C -9 -26.6 -9.9 -25.6 -10.3 -24.4 C -10.7 -23.1 -11 -21.8 -11.7 -20.5 C -14.6 -15.2 -18.8 -8.6 -23.2 -3.4 C -26.6 0.2 -31.4 3.2 -31.6 8 C -31.7 10.4 -31.4 12.4 -30.9 14.2"/>
  <!-- throat -->
  <path d="M -30.9 14.2 C -29.6 18.9 -33.4 31.8 -36.2 36"/>
  <!-- arched crest of the neck -->
  <path d="M -10 33.8 C -10.3 37.8 -12.4 42.8 -16.4 46.6"/>
  <!-- where the neck is cut off -->
  <path d="M -16.4 46.6 C -23 44.2 -30.5 40.1 -36.2 36"/>
  <!-- eye -->
  <path class="fine" d="M -10.8 14.8 C -10 14.6 -9.2 14 -8.8 13.2 C -8.4 12.3 -8.5 11.3 -8.6 10.3 C -8.6 9.8 -8.9 9.4 -9.2 9.1 C -10.2 9.5 -11.1 10.4 -11.3 11.5 C -11.6 12.6 -11.4 13.9 -10.8 14.8"/>
  <!-- nostril, mouth, cheek -->
  <path class="fine" d="M 1.5 -15.2 C 2.1 -16.1 2.4 -17.2 2.4 -18.2 C 2.4 -18.9 2 -19.8 1.3 -20.2 C 0.6 -20.6 -0.4 -20.7 -1.2 -20.3 M -4.4 -26.2 C -5.1 -24.6 -6 -22.8 -6.5 -21.4 C -6.8 -20.5 -6.6 -19.7 -6.1 -19.2 M -13.9 10.3 C -13 7.9 -12.4 5.5 -12.1 3 C -11.9 1.1 -11.7 -0.9 -12.3 -2.7 C -12.8 -4 -13.9 -5.1 -15.2 -5.6 C -16.6 -6 -18.2 -5.6 -19.4 -4.9 C -19.9 -4.6 -20.3 -4.3 -20.6 -3.9"/>
  <!-- mane: two locks along the crest -->
  <path class="fine" d="M -10.8 35.2 C -11.2 36.6 -12 37.8 -13.2 38.8 M -12.9 40.6 C -13.5 41.4 -14.6 42.6 -15.8 43.3"/>
</svg>
