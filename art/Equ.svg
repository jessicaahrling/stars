<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -45 70 85">
  <!-- Equuleus, the little horse (Lilla hästen): as in Bode and Hevelius only the head and neck
       of a foal, upright and seen in profile, with its muzzle to the east towards Pegasus' head
       and the neck cut off below in a gentle slanting curve. Small pricked ears, a short mane of
       soft locks along the crest. Gamma is the eye, delta sits on the face (the bridge of the
       nose) and Kitalpha ("the piece of the horse") on the point of the breast just above the cut. -->
  <!-- near ear -->
  <path d="M 6.5 -30 C 6 -33 6.6 -35.6 8.4 -38 C 10.2 -36.2 11.1 -34.4 11.4 -32.6"/>
  <!-- far ear -->
  <path d="M 11.4 -32.6 C 12.6 -34.4 13.8 -35.8 15.2 -37 C 15.9 -34.6 15.8 -32.2 15.3 -29.8"/>
  <!-- forehead, face, muzzle, chin, jaw, jowl to the throatlatch -->
  <path d="M 6.5 -30 C 3 -29.5 -0.5 -28.8 -4 -27.6 C -9 -25.9 -13.5 -24 -18 -21.8 C -21.6 -20 -24.6 -18 -26.6 -15.6 C -28.2 -13.6 -28.4 -11 -27.4 -9.4 C -26.8 -8.5 -25.8 -8.2 -25 -8.2 L -24.6 -7.8 C -25.2 -7 -25 -5.8 -23.8 -5.4 C -19 -5.2 -14.5 -4.6 -10 -3.6 C -5.5 -2.6 -1 -2 4 -3.6 C 8 -5 10.6 -7.4 12.2 -10.2"/>
  <!-- mane of soft locks and the back of the neck -->
  <path d="M 15.3 -29.8 C 16.8 -31 19.4 -30.2 20.2 -27.4 C 19.6 -26.2 18.6 -25.4 18.4 -24.2 C 20.4 -25.4 23.2 -23.8 23.4 -20.2 C 22.8 -18.8 21.8 -17.6 21.2 -16.2 C 23.4 -17 25.4 -15.4 25.4 -12.2 C 24.8 -10.6 23.4 -9.6 22.6 -8.2 C 24.6 -8.6 26 -6.6 25.8 -3.8 C 25.2 -2.4 23.8 -1.4 22.6 -0.4 C 23.8 -0.4 24.2 1.2 23.4 2.8 C 22.6 3.6 21.4 4.2 21.2 5.2 C 21.4 10 21.8 15 22.4 20 C 22.8 23 23.4 25.4 24.2 27.4"/>
  <!-- throat and breast -->
  <path d="M 12.2 -10.2 C 13.6 -6.4 12.8 -1.4 9.6 3.4 C 5.6 9 -3 13 -8 16.6 C -11.4 19 -12.8 22 -12.8 25.4 C -12.8 27.6 -12.4 29.4 -11.8 31"/>
  <!-- where the neck is cut off -->
  <path d="M -11.8 31 C -3.4 33.6 4.8 33.6 12 31.6 C 16.5 30.5 20.6 29.2 24.2 27.4"/>
  <!-- eye and brow -->
  <path class="fine" d="M -1 -23.2 C 0.2 -25.8 3.6 -26.2 5.4 -24.2 C 4 -22 1 -21.6 -1 -23.2 Z M 5.8 -25.8 C 4 -27.6 0.6 -27.6 -1.4 -25.4"/>
  <!-- nostril, mouth, cheek -->
  <path class="fine" d="M -23.6 -15 C -25.4 -14.6 -26 -12.6 -24.8 -11.6 M -24.6 -7.8 C -23 -8 -21.6 -7.8 -20.6 -7.3 M 4.6 -17 C -1.4 -17.2 -4.6 -13 -3 -9.4 C -2 -7.4 1 -6.8 3.4 -7.4"/>
  <!-- inside of the ear, edge of the mane, neck muscle -->
  <path class="fine" d="M 8.4 -35.6 C 8 -33.8 8.2 -32.2 8.9 -30.8 M 14 -28.2 C 17.2 -24.4 19.2 -18.4 19.8 -12 C 20.2 -6 20 -1 19.4 3 M 16 -4 C 15 3 11.6 9.4 5.6 14.6"/>
</svg>
