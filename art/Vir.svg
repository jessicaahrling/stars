<svg xmlns="http://www.w3.org/2000/svg" viewBox="-230 -180 515 280">
  <!-- Virgo, the winged maiden (Jungfrun), flying face-down westwards along the ecliptic with
       her head raised towards Leo, seen from her left side. Her wing rises from her back, her
       right arm is hidden behind her body and her left arm hangs down holding the ear of wheat.
       nu is in the hair at the brow and Zavijava (beta) at the chin, Zaniah (eta) on the breast
       behind the arm, Porrima (gamma) between the girdle bands, Minelauva (delta) in the lowest
       feathers of the wing and Vindemiatrix (epsilon) near the wing tip. Spica is the ear of
       wheat in her left hand and theta her left hip. Under the calf-length gown Heze (zeta) is
       on the right thigh, tau the right knee and Syrma (iota) on the left shin; the bare feet
       point down and back out of the hem with the soles up, 109 Vir in the right heel and
       Rijl al Awwa (mu) in the left. -->
