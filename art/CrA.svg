<svg xmlns="http://www.w3.org/2000/svg" viewBox="-70 -49 94 81">
  <!-- Corona Australis (Södra kronan), the Southern Crown: the laurel wreath (stephanos) of the
       old atlases, drawn as a victor's wreath of two leafy laurel branches tied with a ribbon bow
       and open at the front, fitted to the arc of its stars. The bow sits on the south-east bend
       between delta and zeta, its ribbon ends trailing outwards. The eastern branch climbs from the
       bow through delta, beta, alpha (Meridiana) and gamma and bends west to its tip past epsilon;
       the southern branch runs from zeta through eta and theta and curls north at its tip. Each
       star sits on a branch stem among the leaves, which grow smaller towards the branch tips. -->
