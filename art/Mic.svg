  <!-- Microscopium, Lacaille's microscope: "a tube above a square box". An 18th-century
       compound microscope of the Cuff type, standing upright. Gamma sits at the foot of the
       eyepiece on top of the tube and alpha in the clamp ring that holds the body tube. A
       square pillar rises from the back of the box with epsilon in the milled focusing knob
       on its top and theta1 in its foot. Below the tube are the stage with its slider and
       the mirror in its fork, and the square box with its drawer carries iota near its
       lower west corner. -->
