<svg xmlns="http://www.w3.org/2000/svg" viewBox="-95 -80 180 240">
  <!-- Libra, the Scales (Vågen): a hanging balance held up by its ring, the beam tipped down to the
       east under the heavier pan, the tongue leaning with it inside the shears. Zubeneschamali (beta)
       is the ring at the top, Zubenelhakrabi (gamma) the eye at the east end of the beam,
       Zubenelgenubi (alpha) sits on the outer cord of the raised west pan with Brachium (sigma) on
       its rim, upsilon lies on the rim of the low east pan and tau in its bowl. -->
  <!-- the ring it hangs by (Zubeneschamali), the rod, the shears and the pivot boss -->
  <path d="M -7.4 -71.5 C -3.3 -71.5 0.1 -68.1 0.1 -64 C 0.1 -59.9 -3.3 -56.5 -7.4 -56.5 C -11.5 -56.5 -14.9 -59.9 -14.9 -64 C -14.9 -68.1 -11.5 -71.5 -7.4 -71.5 Z"/>
  <path d="M -8.7 -56.6 L -8.7 -42.5 M -6.1 -56.6 L -6.1 -42.5"/>
  <path d="M -13.4 -20.2 L -13.4 -37 C -13.4 -40.6 -10.7 -42.6 -7.4 -42.6 C -4.1 -42.6 -1.4 -40.6 -1.4 -37 L -1.4 -23.6"/>
