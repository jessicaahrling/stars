  <!-- the tongue, upright to the beam, so it leans east inside the shears -->
  <path d="M -10 -21.8 L -11.6 -32.5 L -7.3 -22.6"/>
  <!-- the beam, tipped down to the east, an eye at each end (Zubenelhakrabi in the east eye) -->
