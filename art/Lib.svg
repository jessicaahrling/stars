  <path d="M -59.7 -4.1 C -61.5 -3.6 -62.7 -2.6 -64.5 -1.4 C -62.4 -1.4 -60.8 -1.3 -59.1 -1.8"/>
  <path d="M 45 -34.1 C 46.7 -34.6 48.3 -34.5 50.4 -34.5 C 48.6 -33.3 47.4 -32.3 45.6 -31.8"/>
