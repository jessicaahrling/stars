<svg xmlns="http://www.w3.org/2000/svg" viewBox="-215 -185 470 290">
  <!-- Carina, the keel of the ship Argo: the hull of the galley seen from the side, pitched
       bow-down as in the old atlases, with its forward end broken off in splintered planks in
       the east. The gunwale sweeps up past Alsephina (δ Vel) to Regor (γ Vel), the star the three
       parts of Argo share; the light wale below it runs up into the rail just past Regor, so the
       raised stern deck runs on alone to ν Pup, where Puppis's hull lies over it. A raked stern
       post closes the hull, and beside it the steering oar hangs from the end of the deck at ν,
       its blade on Canopus. A row of overlapping round shields hangs below the wale, from u at
       the bow to Aspidiske (ι, "the little shield") on the aftmost one. Two strakes run from the
       broken planks to the stern post, past Avior and χ on the hull side, and a keel strip runs
       along the keel with Miaplacidus and ω; θ and the little ring of p, q, x, y, z lie by the
       broken end. -->
