<svg xmlns="http://www.w3.org/2000/svg" viewBox="-205 -163 444 277">
  <!-- Carina, the hull of the ship Argo: the stern half of a Bode-style galley seen from
       the side, pitched bow-down, its broken-off forward end (east) splintered. Eight round shields
       hang along the side, from u at the bow past Aspidiske (iota, "the little shield"); three oars
       reach down and aft from under the hull with omega and Miaplacidus on the blades of the two
       aftmost, so the flying fish (Volans) leaps clear beneath the long, clean run of the bottom.
       The gunwale runs aft past Alsephina (delta Vel), where the stub of the mast stands on it,
       and sweeps up to Regor (gamma2 Vel), where the raised poop deck of Puppis carries it on and
       the after leech of the sail comes down. The bottom sweeps up at the stern to nu Pup, where
       the stern post of Puppis continues it. The broad blade of the steering oar hangs below the
       stern on Canopus, short of Pictor's easel; its loom runs on, straight, in Puppis. Fine
       lines: the rail under the gunwale, a wale and a strake, which run on into Puppis. Theta and
       the ring of p, q, x, y, z and z2 lie in the hull by the broken end, Avior lower in its side
       and chi high in the stern quarter. -->
