<svg xmlns="http://www.w3.org/2000/svg" viewBox="-215 -185 470 290">
  <!-- Carina, the keel of the ship Argo: the hull of the galley seen from the side, pitched
       bow-down as in the old atlases, with its forward end broken off in splintered planks in
       the east. The gunwale, with a light wale along it, sweeps up past Alsephina (δ Vel) to
       Regor (γ Vel), the star the three parts of Argo share, and runs on as a raised stern deck
       to the squared stern at ν Pup. There the steering oar hangs down along the raked stern,
       its loom just above the deck and its blade on Canopus; the keel runs into the blade.
       Aspidiske (ι, "the little shield") is on the last of the shields hung below the wale,
       Avior and χ on the hull side, Miaplacidus and ω on the keel, and θ with the little ring
       of p, q, u, x, y, z by the broken end. -->
