<svg xmlns="http://www.w3.org/2000/svg" viewBox="-215 -180 460 280">
  <!-- Carina, the keel of the ship Argo: the hull of the galley seen from the side, pitched
       bow-down as in the old atlases, with its forward end broken off in splintered planks in
       the east. The gunwale climbs past Alsephina (δ Vel) to Regor (γ Vel), the star the three
       parts of Argo share, and the stern deck runs on from there with a slight sheer that rises
       again towards ν Pup. The stern sweeps up from the heel of the keel in a curved counter,
       and the steering oar hangs clear of it from the end of the deck at ν, its blade on
       Canopus. A wale runs along the hull below the gunwale, and seven round shields hang on it,
       from u at the bow to Aspidiske (ι, "the little shield") on the aftmost one. Two strakes
       and a keel strake run from the broken planks to the stern, past Avior and χ on the hull
       side; Miaplacidus and ω lie on the keel, and θ and the little ring of p, q, x, y, z and
       z2 by the broken end. -->
