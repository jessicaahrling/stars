<svg xmlns="http://www.w3.org/2000/svg" viewBox="-500 -230 1050 470">
  <!-- Hydra, the water snake: a long serpent stretched along the sky with its head raised in the west
       and its tail in the east. The head is the ring of stars south of Cancer: Minazal (delta) in the
       upper jaw, Minchir (sigma, "the snout") and eta in the lower jaw, epsilon (Ashlesha) and rho on
       the crown, zeta on the nape. The neck runs east through theta to iota, bends south to Alphard,
       the snake's heart, and the body winds east through upsilon, lambda, mu and nu, dips south through
       xi and beta (under Crater and Corvus), rises to gamma and tapers through pi to the tail tip at
       E (58 Hya). -->
