<svg xmlns="http://www.w3.org/2000/svg" viewBox="-53 -2 106 63">
  <!-- Apus, the bird of paradise (Paradisfågeln): the legless "Avis Indica" of Bayer and Bode.
       It flies west with its near wing raised, and the long flank plumes it was famous for
       stream back to the east from the rump: four tapering plumes that fan out and droop more
       the lower they sit, with a single thin tail wire curling up above them. No feet, as the
       old legend had it. Alpha is the eye. Beta lies at the root of the top plume, gamma at the
       root of the third, delta1 in the base of the spray just behind the body.
       Parts: head with a short, slightly decurved beak, body, raised wing, plume spray, tail
       wire; fine lines for the eye, the wing coverts, the flank where the plumes leave the body
       and the shaft of the lowest plume. -->
