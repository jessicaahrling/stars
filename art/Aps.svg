<svg xmlns="http://www.w3.org/2000/svg" viewBox="-53 -2 106 63">
  <!-- Apus, the bird of paradise (Paradisfågeln): the legless "Avis Indica" of Bayer and Bode.
       It flies west with its near wing raised, and the long flank plumes it was famous for
       stream back to the east as a spray that breaks into five flowing tongues, the top one
       curling up and the bottom one drooping. No feet, as the old legend had it.
       Alpha is the eye. Delta1 and gamma lie in the plume spray just behind the body, gamma
       towards its lower edge, and beta high in the spray at the root of the upturned top plume.
       Parts: head and beak, body, raised wing, plume spray; fine lines for the eye, gape,
       hood, flank, wing coverts and primaries, and the filaments of the plumes. -->
