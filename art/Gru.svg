  <!-- Grus, the crane: flying north-west, seen from below, with its wings spread and its long
       neck stretched out towards the Southern Fish ("with the wings spread abroad, and as it
       were striking with its bill at the South Fish"). Gamma (Aldhanab) is the eye, lambda and
       mu lie along the neck and the delta pair at its root on the breast. Tiaki (beta) is the
       heart in the body. Alnair (alpha) is on the left (west) wing and theta on the right (east)
       wing. The long legs trail behind the tail, with epsilon on the legs and zeta at the feet. -->
