<svg xmlns="http://www.w3.org/2000/svg" viewBox="-118 -104 210 186">
  <!-- Grus, the crane: flying north-west, seen from below, with its wings spread and its long
       neck stretched out towards the Southern Fish ("with the wings spread abroad, and as it
       were striking with its bill at the South Fish"). Gamma (Aldhanab) is the eye, lambda and
       mu lie along the neck and the delta pair where the neck rises from the body between the
       wings. Tiaki (beta) is the heart in the body. Alnair (alpha) is on the right (west) wing
       and theta on the left (east) wing. The long legs trail from under the short fanned tail,
       with epsilon at the heel and zeta at the foot. -->
