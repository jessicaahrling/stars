  <!-- Dorado, the swordfish (Svärdfisken; Xiphias in Hevelius and Bode): seen from the side,
       diving south-east, sword first, after the flying fish Volans that it hunts, back to the north-east.
       Gamma lies in the crescent tail, alpha on the narrow tail stem, zeta on the back, beta on the
       shoulder below the swept-back first dorsal fin, HIP 27890 on the nape behind the gill cover and
       delta on the cheek behind the eye; the sword points past delta towards Volans.
       Parts: body with sword, sickle dorsal fin and lunate tail, gill cover, mouth, long pectoral fin,
       anal fin, small second dorsal and anal fins; fine lines for the eye, lateral line, sword ridge
       and the rays of the dorsal and pectoral fins. -->
