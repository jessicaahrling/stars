<svg xmlns="http://www.w3.org/2000/svg" viewBox="-135 -120 275 225">
  <!-- Pavo, the peacock: standing in profile and facing east towards Indus, neck raised,
       its long train half spread behind it to the west. Peacock (alpha) is the eye,
       gamma the front of the breast, beta on the folded wing, delta on the rump where
       the train grows out. lambda and xi lie along the upper edge of the train, pi and
       eta at its far end, zeta and epsilon along the lower edge, where it sweeps the
       ground (epsilon in the eyespot of the lowest feather). Each train feather is one fine stroke: a shaft fanning out from the rump,
       then a drop-shaped eyespot inside its scallop. -->
