  <!-- Lupus, the wolf (Ptolemy's Therion, the wild beast seized by Centaurus): rearing up on
       its hind legs and lunging east, away from the centaur whose reaching hand (kappa Cen)
       grips it at the loins; head raised with jaws open, forelegs pawing forward, bushy tail
       hanging. Chi on the muzzle, psi1 in the cheek, phi1 on the ruff of the nape, delta in
       the shoulder, gamma on the chest, theta the raised near forepaw and eta the far forepaw,
       epsilon on the belly, Ke Kouan (beta) in the loins, mu at the stifle, zeta the hind foot
       and Men (alpha) at the root of the tail. -->
