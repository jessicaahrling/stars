  <!-- Cassiopeia, the queen of Ethiopia, seated on her throne and drawn head-down as she
       hangs on the sky around the pole. Her crowned head at Fulu (zeta), Schedar on her breast,
       Achird (eta) on her girdle, Navi (gamma) on her hips above the seat, Ruchbah (delta,
       "the knee") at her knees and Segin (epsilon) on her shins. Her raised left arm has its
       elbow at Marfak (theta, "the elbow") and holds up a palm frond; Caph (beta) sits on the
       back of the throne. -->
