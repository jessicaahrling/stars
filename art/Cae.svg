  <!-- Caelum (Gravstickeln), Lacaille's Caela Scalptoris: the engraver's tools, a burin and an
       echoppe (etching needle), laid crosswise and tied with a ribbon bow. The burin runs north-
       south with its lozenge point to the north: delta sits in its mushroom handle and alpha on
       the ferrule. Beta is in the knot of the bow, whose loops lie to the north-west and whose
       swallow-tailed ends flutter to the south-east. The echoppe crosses the burin under the
       knot, from its turned handle at gamma in the east to its needle point in the west. -->
