<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -44 125 91">
  <!-- Musca, the fly (Flugan), first drawn as Apis, the bee, by Plancius and Bayer. Seen from
       above in flight with its head towards Crux: beta is the head (between the big compound eyes),
       alpha the thorax, gamma the end of the abdomen, and the wings are spread on either side,
       delta on the left (east) wing and epsilon and lambda along the right (west) wing, lambda near its tip.
       Parts: head, thorax, abdomen, both wings and six legs; fine lines for the eyes, antennae,
       thorax stripes, abdomen segments and wing veins. -->
  <!-- head -->
  <path d="M -12.9 -26.4 C -11.5 -29.1 -5.9 -31.3 -2.2 -27.7 C 0.5 -25 -0.1 -19.9 -4.3 -17.5 C -6 -16.4 -10.4 -14.5 -12.4 -14 C -17 -12.6 -21.1 -15.6 -21.3 -19.5 C -21.3 -24.7 -15.9 -27.2 -12.9 -26.4 Z"/>
  <!-- thorax -->
  <path d="M -7.9 -14.8 C -2 -17.3 2.3 -15.7 4.2 -11.5 C 6.1 -6.9 4 -1.8 -1.3 0.4 C -6.7 2.7 -11.8 0.8 -13.8 -3.7 C -15.7 -8 -13.8 -12.3 -7.9 -14.8 Z"/>
  <!-- abdomen -->
  <path d="M -1.1 1 C 5.1 -1.7 10.2 -0.2 12.1 4.4 C 15.3 11.8 14.6 20.8 9.7 26 C 2.5 26 -4.5 20.3 -7.7 13 C -9.7 8.4 -7.3 3.7 -1.1 1 Z"/>
  <!-- right wing -->
  <path d="M 1.8 -14.6 C 10.2 -24.3 30.9 -32 44.7 -34.6 C 54.6 -36.4 60.2 -30.4 54 -24.9 C 44.5 -15.1 25.4 -2.6 4.9 -7.4"/>
  <!-- left wing -->
  <path d="M -14.5 -6.6 C -26.6 -5.1 -41.1 7.1 -48.8 16.5 C -54.2 23.3 -51.3 30.7 -44.3 28.8 C -32.3 26.5 -14.3 18 -10.6 0.1"/>
  <!-- right front leg -->
  <path d="M -1.4 -15.9 Q 1.8 -19 4.2 -23.5 Q 4.1 -28.7 1.7 -33.8 L -0.6 -35.8"/>
  <!-- left front leg -->
  <path d="M -13.2 -10.8 Q -17.7 -10.6 -22.6 -11.9 Q -26.3 -15.6 -28.4 -20.8 L -28.2 -23.9"/>
  <!-- right hind leg -->
  <path d="M 10.1 1.6 Q 15.2 1.8 19.5 3.9 Q 23.2 8.4 25 14.1 L 24.8 17.5"/>
  <!-- left hind leg -->
  <path d="M -8.4 9.6 Q -11.7 13.4 -13.2 18 Q -12.4 23.7 -9.5 29 L -6.8 31.1"/>
  <!-- right middle leg -->
  <path d="M 22.4 -7.1 Q 25.7 -6.4 29.4 -4.1 Q 32.8 -0.1 34.3 4.7 L 33.9 7.9"/>
  <!-- left middle leg -->
  <path d="M -25.4 21 Q -25 25.3 -25.9 28.5 Q -25.4 33 -23 37 L -20.4 39"/>
  <!-- eyes -->
  <path class="fine" d="M -7.3 -29 C -4.9 -30 -2.7 -27.9 -1.9 -25.5 C -0.9 -22.6 -1.7 -20.1 -3.7 -19.2 C -5.9 -18.3 -7.5 -20.4 -8.5 -22.8 C -9.7 -25.4 -9.5 -28 -7.3 -29 Z M -18.7 -24.1 C -21.1 -23.1 -21.1 -20 -19.9 -17.7 C -18.5 -15 -16 -13.9 -14 -14.8 C -11.8 -15.7 -12.3 -18.4 -13.3 -20.7 C -14.4 -23.3 -16.5 -25 -18.7 -24.1 Z"/>
  <!-- antennae -->
  <path class="fine" d="M -14 -26.6 Q -15.3 -28.4 -17 -28.7 M -12.3 -27.3 Q -12.7 -29.5 -11.9 -31"/>
  <!-- thorax stripes -->
  <path class="fine" d="M -8.8 -12.2 C -7.6 -8.4 -5.8 -4.4 -3.7 -0.9 M -5.5 -13.7 C -3.5 -10.2 -1.8 -6.1 -0.7 -2.2"/>
  <!-- abdomen segments -->
  <path class="fine" d="M -8.4 10.1 C -2.8 9.8 6.4 5.8 10.5 1.9 M -6.3 15.6 C -0.3 15.5 8.9 11.5 13.1 7.2"/>
  <!-- veins right -->
  <path class="fine" d="M 9.3 -13.7 C 22.9 -17.1 37.5 -20.8 51.4 -23.1 M 11.4 -10.4 C 19.9 -10.1 28 -11 36.7 -13.3"/>
  <!-- veins left -->
  <path class="fine" d="M -17.3 -0.3 C -25.5 8.6 -34.4 18 -41.8 27.7 M -20 -1.9 C -27.6 1.4 -34.6 6.4 -41 12.2"/>
</svg>
