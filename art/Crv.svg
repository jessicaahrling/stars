<svg xmlns="http://www.w3.org/2000/svg" viewBox="-56 -44 108 116">
  <!-- Corvus, the raven, perched on the back of Hydra as in Hevelius and Bode: it faces west
       with its wing raised and bends its head down to peck at the water snake. Alchiba (alpha)
       is the tip of the beak and Minkar (epsilon, "the beak") its base on the head. Gienah
       (gamma, "the wing") sits near the bend of the raised wing, Algorab (delta) further out
       on it and eta at the root of the fingered primaries. Kraz (beta) is at the feet, and the
       faint zeta in the breast. -->
  <!-- neck rising from under the shoulder of the wing, rounded back of the head, crown and forehead -->
  <path d="M 32 5.5 C 33 8.8 34.8 10.8 37.4 12.4 C 40 14 43.6 15.6 46 19.8 C 48.6 24.2 50.2 27.8 50.3 32.8 C 50.5 38.6 48.6 41.4 47.4 44.2"/>
  <!-- heavy arched beak, deep at the base, Alchiba (alpha) at its tip -->
  <path d="M 47.4 44.2 C 49.6 49.6 45.6 57.4 41.5 65.2 C 40.1 61 38.6 56 36.6 52"/>
  <!-- throat, breast (faint zeta) and belly -->
  <path d="M 36.6 52 C 33.6 51.6 27.5 55 20.5 52.5 C 14 50.2 -1.5 47.3 -10 42.5 C -16 39 -20 35 -24 31.5"/>
  <!-- wedge-shaped tail narrowing to a blunt point -->
  <path d="M -24 31.5 C -30 31.4 -35.2 28.8 -38.6 26.2 C -40.8 24.6 -40.8 22.2 -38.4 21.6"/>
  <!-- leading edge of the raised wing, Gienah (gamma) inside the bend -->
  <path d="M 32 5.5 C 33.4 1 34.8 -6 34 -14 C 33 -27 14 -35 -2 -36.5 C -6 -36.9 -10 -37.2 -13 -37.4"/>
  <!-- pointed primaries fanning from the wrist, the outermost longest: Algorab (delta) and eta at their roots -->
  <path d="M -13 -37.4 C -22.8 -38.1 -31.4 -38.8 -37.4 -40.5 C -33.8 -35.6 -29.4 -32.3 -23.1 -28.1 C -29.4 -29.9 -34.1 -31 -39.3 -30.4 C -35.2 -27.1 -30.7 -25.6 -24.4 -23.8 C -30.1 -23.6 -34.2 -23.2 -38.5 -21 C -34 -19.2 -29.7 -19.1 -23.7 -19.3 C -28.6 -17.6 -32 -16.1 -34.9 -12.9 C -30.5 -12.4 -26.8 -13.6 -21.8 -15.5 C -25.2 -12.8 -27.6 -10.8 -28.9 -7.2 C -25.2 -7.6 -22.8 -9.2 -19.5 -11.8"/>
  <!-- secondaries, one long curve down over the rump that sweeps out along the top of the tail -->
  <path d="M -19.5 -11.8 C -21.6 -5.4 -24.6 -0.6 -25 5.2 C -25.4 10.8 -24.8 15.6 -27.4 18.6 C -29.6 21 -34 21.2 -38.4 21.6"/>
  <!-- near leg -->
  <path d="M -5 44.8 L -10.5 53.5 M -10.5 53.5 Q -6 53.6 -2.8 55.8 M -10.5 53.5 Q -8 55.6 -6.6 59 M -10.5 53.5 Q -12.6 55.2 -14.2 57.6"/>
  <!-- far leg: beta at the foot -->
  <path d="M -13 40.6 L -18.5 51.5 M -18.5 51.5 Q -16.6 51.6 -15 52.6 M -18.5 51.5 Q -21.6 52 -24.6 54.2"/>
  <!-- eye, base of the upper mandible and gape, and the ruff of hackles behind the head -->
  <path class="fine" d="M 41 36.5 C 41 34.6 44 34.6 44 36.5 C 44 38.5 41 38.5 41 36.5 M 47.4 44.2 C 44.4 43.6 41.6 44.4 39.5 46.3 C 39.9 51 40.8 56.5 41.7 61.8 M 41.8 15.1 C 37.6 19.4 34.4 25.8 34 31.6 C 33.8 35 34.2 38.2 35.2 40.6"/>
  <!-- wing coverts, round the shoulder and along the lower edge of the wing to the secondaries -->
  <path class="fine" d="M -3 -27.8 C 9 -26.6 18.4 -21.4 20.8 -14 C 22.4 -8.8 22.2 -1.6 21.4 3 C 21 5.6 20.4 7.6 19.5 9.2 Q 15 10 11.5 7 Q 7.2 6.7 5 3 Q 0.9 3.8 -2 0.8 Q -5.6 2.5 -9 0.5 Q -11.7 3.2 -15.5 2.5 Q -19.6 5.8 -25 5.2"/>
  <!-- primaries -->
  <path class="fine" d="M -15.4 -24.5 L -23.1 -28.1 M -16 -22.7 L -24.4 -23.8 M -15.9 -20.9 L -23.7 -19.3 M -15.2 -19.1 L -21.8 -15.5 M -14.2 -17.4 L -19.5 -11.8"/>
  <!-- tail feathers -->
  <path class="fine" d="M -27 27.4 C -30.6 27.2 -34.2 26 -37.2 24.6 M -29.6 23.6 C -32.4 23.2 -34.8 22.9 -37 22.8"/>
</svg>
