  <!-- Ursa Minor, the little bear: the bowl of the Little Dipper is its body and the handle its long
       classical tail, rising from the top of the rump up to the pole. It walks west, down a slope,
       with the heavy head carried low in front of the shoulder hump; far foreleg reaching, near
       foreleg planted, near hind leg under the haunch and far hind leg pushing off behind. Polaris
       at the tip of the tail, Yildun and epsilon along it, zeta on the back at the root of the tail,
       eta in the haunch, Kochab in the shoulder and Pherkad at the elbow above the near foreleg. -->
