<svg xmlns="http://www.w3.org/2000/svg" viewBox="-183 -155 382 338">
  <!-- Andromeda, the chained princess, seen from the front and drawn head-down as she lies on the sky:
       her head at Alpheratz (shared with Pegasus), her feet to the north-east. She wears a long
       girdled gown and stretches both arms out to the rocks; her head is bowed in profile towards her
       chained right hand, and her hair is gathered at the back into a heavy knot that holds Alpheratz
       (the only part of her that reaches into the corner of the Square of Pegasus). Pi is on her right
       shoulder, delta on her breast and epsilon on her left shoulder. The right arm runs along pi-iota,
       slightly bent at the elbow, to the shackle at iota; the hand hangs from it with kappa in the palm
       and lambda and psi at the fingertips, and the chain runs to a ring set in a boulder at omicron.
       The left arm bends at the elbow at zeta, the cuff is on the wrist at eta, the hand hangs from it
       and a short chain trails from its corner. Mirach, mu and nu lie on the girdle across her hips,
       phi on her right knee under the gown; Nembus is on her right slipper and Almach on her left,
       both peeping out under the hem; the gown's folds fan out from the girdle towards them. -->
