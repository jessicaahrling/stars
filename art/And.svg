<svg xmlns="http://www.w3.org/2000/svg" viewBox="-177 -150 374 319">
  <!-- Andromeda, the chained princess, seen from the front and lying along the sky with her
       head at Alpheratz (south-west) and her feet to the north-east. Her head rests on a short
       neck, turned in profile towards her right hand, with her hair swept back into a knot at
       the nape; Alpheratz is on her temple. Rounded shoulders and a shallow neckline; delta and
       pi are on her breast and epsilon on her left shoulder. Her right arm reaches north-west
       with a soft bend at the elbow: the shackle is on the wrist over iota, the open hand hangs
       over kappa with the thumb over lambda and the fingertips at psi, and a chain runs past
       omicron to a ring. Her left arm bends at the elbow near zeta, with the shackle over eta,
       an open hand and a short chain to a ring. The girdle lies across her hips through nu, mu
       and Mirach, with two short sash ends. The robe falls in soft folds over her right knee
       (phi) to a wavy hem; her slippers peek out from under it, Nembus the right and Almach
       the left. -->
