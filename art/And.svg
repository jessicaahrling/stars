<svg xmlns="http://www.w3.org/2000/svg" viewBox="-177 -150 374 319">
  <!-- Andromeda, the chained princess, seen from the front and lying along the sky with her
       head at Alpheratz (south-west) and her feet to the north-east. Her head is a clean oval
       on a short neck, turned in profile up towards her chained right hand (brow, nose, chin),
       with her hair gathered in one curled knot at the nape; Alpheratz is on her head. Rounded
       shoulders and a shallow neckline; delta and pi are on her breast and epsilon on her left
       shoulder. Her right arm reaches north-west with a soft bend at the elbow: the shackle is
       on the wrist over iota, the open hand hangs over kappa with the thumb over lambda and the
       fingers at psi, and a chain runs past omicron to a ring. Her left arm bends at the elbow
       near zeta, with the shackle over eta, an open hand and a short chain to a ring. The
       girdle lies across her hips through nu, mu and Mirach. Her robe falls in soft folds
       over her right knee (phi) to a wavy hem; below it her lower legs end in pointed feet
       angled outward, Nembus the right foot and Almach the left. -->
