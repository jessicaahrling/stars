<svg xmlns="http://www.w3.org/2000/svg" viewBox="-184 -154 377 336">
  <!-- Andromeda, the chained princess, seen from the front and lying along the sky with
       her head at Alpheratz (south-west) and her feet to the north-east. Her plain oval
       head bows towards her right shoulder on a short neck, with Alpheratz in the hair near
       the crown. A scoop neckline runs between her shoulders above delta; epsilon is on her
       left shoulder and pi on her right side. Her right arm reaches north-west, the hand
       hanging from the shackled wrist over iota, kappa, lambda and psi, and a chain runs from
       the cuff to a ring at omicron. Her left arm has the elbow at zeta, eta on the forearm
       and a shackle with a short trailing chain on the wrist. Mirach and mu sit on the girdle
       at her narrow waist; its loose end flies out from her right hip past nu. Phi is in the
       flared skirt, Almach on her left foot and Nembus on her right. -->
