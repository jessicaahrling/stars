<svg xmlns="http://www.w3.org/2000/svg" viewBox="-183 -155 382 338">
  <!-- Andromeda, the chained princess, seen from the front and drawn head-down as she lies on the sky:
       her head at Alpheratz (shared with Pegasus), her feet to the north-east. She wears a long
       girdled gown and stretches both arms out to the rocks; her head, hair gathered in a bun, is
       bowed in profile on a slender neck towards her chained right hand. Pi is on her right shoulder,
       delta on her breast and epsilon on her left shoulder. The right arm runs straight along pi-iota
       to the shackle at iota; the hand hangs from it with kappa in the palm and lambda and psi at the
       fingertips, and the chain runs to a ring set in a rock at omicron. The left arm bends at the
       elbow at zeta, the shackle is on the wrist at eta and a short chain hangs from its corner.
       Mirach, mu and nu lie on the girdle across her hips, phi on her right knee under the gown;
       Nembus is on her right slipper (toe turned north) and Almach on her left (toe turned east), both
       feet peeping out under the hem; the gown's folds fan out from the girdle towards them. -->
