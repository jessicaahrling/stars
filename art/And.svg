<svg xmlns="http://www.w3.org/2000/svg" viewBox="-177 -150 368 319">
  <!-- Andromeda, the chained princess, seen from the front and lying along the sky with her
       head at Alpheratz (south-west) and her feet to the north-east. Her head sits on a short
       neck between the shoulders, turned in profile towards her right hand, with her hair
       gathered in a knot at the nape; Alpheratz is on her temple. A shallow neckline runs
       between the shoulders; delta and pi are on her breast and epsilon on her left shoulder.
       Her right arm reaches north-west with a slight bend at the elbow: the shackle sits on the
       wrist over iota, the hand hangs over kappa with the thumb at lambda and the fingertips at
       psi, and a chain runs to a ring at omicron. Her left arm bends at the elbow near zeta,
       with the shackle over eta, an open hand and a short chain to a ring. The girdle lies
       across her hips through nu, mu and Mirach, knotted with one ribbon end. Phi is in the
       skirt; Nembus is her right slipper and Almach her left. -->
