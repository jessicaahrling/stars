<svg xmlns="http://www.w3.org/2000/svg" viewBox="-49.2 -20.3 83.2 83.2">
  <!-- Reticulum (Nätet), Lacaille's rhomboidal reticle (le Réticule rhomboïde), as in his 1756
       planisphere and Bode's Uranographia: the crossed wires of a telescope eyepiece, a rhombus
       whose long diagonal is twice the short one, with both diagonals, held in a round brass
       ring. Epsilon and beta sit in the two sharp tips of the rhombus, where it touches the
       ring at the ends of the long diagonal; alpha, the brightest star, lies on the eastern
       wire by the blunt eastern corner; gamma sits where the two diagonals cross in the middle,
       and delta inside the western half of the rhombus. -->
  <g>
    <!-- the ring: outer rim, turned bevel, inner edge -->
    <path d="M -13.8 58.3 C -34.3 54.9 -48.1 35.6 -44.7 15.1 C -41.3 -5.4 -21.9 -19.2 -1.4 -15.8 C 19.1 -12.4 32.9 6.9 29.5 27.4 C 26.1 47.9 6.7 61.7 -13.8 58.3 Z"/>
    <path class="fine" d="M -13.5 56.3 C -32.8 53 -45.8 34.7 -42.6 15.4 C -39.4 -3.9 -21.1 -17 -1.7 -13.8 C 17.6 -10.5 30.6 7.8 27.4 27.1 C 24.2 46.4 5.9 59.5 -13.5 56.3 Z"/>
    <path d="M -13.1 54.2 C -31.3 51.1 -43.5 33.9 -40.5 15.8 C -37.5 -2.4 -20.3 -14.7 -2.1 -11.7 C 16.1 -8.6 28.3 8.6 25.3 26.7 C 22.3 44.9 5.1 57.2 -13.1 54.2 Z"/>
  </g>
  <g>
    <!-- the rhombus of wires, tips on epsilon (north-east) and beta (south-west) -->
    <path d="M -27 -5.9 L -21.4 31.1 L 11.8 48.4 L 6.2 11.4 Z"/>
    <!-- the two diagonal wires, running out to the ring -->
    <path class="fine" d="M -27 -5.9 L 11.8 48.4 M -34.7 40.7 L 19.5 1.9"/>
  </g>
</svg>
