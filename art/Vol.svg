<svg xmlns="http://www.w3.org/2000/svg" viewBox="-95 -66 150 106">
  <!-- Volans, the flying fish (Flygfisken): gliding east over the waves, away from Dorado that
       hunts it, with its big pectoral fins spread like wings. As in Bayer and Bode, a slim fish
       seen from the side: the near wing raised high over the back, the far wing hanging below
       the belly, and a forked tail with the longer lower lobe of a flying fish.
       Alpha is the eye in the blunt head, beta lies in the raised wing near its root, epsilon on
       the middle of the body, delta on the upper and gamma on the lower lobe of the tail, and
       zeta (not in the stick figure) at the tip of the lower wing.
       Parts: head and belly, back, tail, both wings, dorsal, pelvic and anal fins, gill cover;
       fine lines for the eye, mouth and the rays of the wings and tail. -->
