<svg xmlns="http://www.w3.org/2000/svg" viewBox="-175 -160 325 345">
  <!-- Sagittarius, the archer: a centaur galloping west, drawing his bow at Scorpius. The
       fillet round his head is knotted at the back and streams one long ribbon upward, and
       a short cloak flies back from his shoulders. Kaus Media is the bow hand, Kaus Borealis
       and Kaus Australis the bow limbs with Polis and eta at the recurved tips, Alnasl the
       arrow point, Nunki the drawing hand, phi on the arrow, nu the eye, xi and omicron the
       head, pi at the knot, d, rho and upsilon in the ribbon, psi, chi and h2 in the cloak,
       Rukbat the fore knee, Arkab the fore fetlock, theta the hind thigh, iota the hind
       fetlock, omega the root of the tail. -->
