<svg xmlns="http://www.w3.org/2000/svg" viewBox="-68 -92 232 266">
  <!-- Cepheus, the king of Ethiopia, drawn head-down like his queen Cassiopeia, his feet
       towards the pole. His crowned head is at delta, zeta and epsilon, with epsilon in a
       spike of the crown, and he looks east, his pointed beard forked in two. Alderamin
       ("the right forearm") is at the end of his right sleeve, Kabalfird (eta) at the wrist
       and Al Kidr (theta) in the open right hand. Alfirk (beta) is on his right side below
       the belt, iota at the left elbow, and the left fist holds a knobbed sceptre tipped
       with a fleur-de-lis. Errai (gamma) is his left foot and kappa his right foot. The
       Garnet Star (mu) sits in the corner of the royal cloak that falls from his shoulders
       behind the right arm. -->
