<svg xmlns="http://www.w3.org/2000/svg" viewBox="-231 -153 497 314">
  <!-- Aquarius, the water bearer (Vattumannen): a youth in profile facing east, a cloth belted round
       his hips, lunging east on his right leg. His right arm is bent and holds up the water urn
       (flat foot and short stem to the north-west, flared lip pouring to the south-east); his left
       arm, with a cloth hanging from it, reaches out west towards Capricornus. The stream pours
       from the urn, bends east and south, curls back west under his right foot and narrows to a
       rounded tongue towards Fomalhaut.
       Sadalmelik on the right shoulder, Sadalsuud in the left upper arm, Sadachbia the right
       wrist, zeta, eta and pi in the urn, mu and Albali in the left hand, Albulaan on the cloth,
       Ancha the right hip, iota the skirt over the left thigh, Skat the right shin, Hydor, psi,
       omega, A, b and c in the water. -->
