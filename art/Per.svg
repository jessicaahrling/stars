<svg xmlns="http://www.w3.org/2000/svg" viewBox="-160 -142 315 280">
  <!-- Perseus flying on winged sandals: legs in profile striding east, torso turned to us,
       head (with a small wing swept up and back from the cap) looking back west along his raised
       curved sword. Gamma is the right shoulder, eta the raised right elbow, the Double Cluster the
       sword hand and phi lies on the blade near its tip. Tau sits in the right shoulder below the
       raised arm, iota on the chest, Mirfak on his right side, psi and delta on the right hip. The
       left arm hangs from theta (left shoulder) to Misam (kappa, the wrist); the fist holds Medusa's
       head by two twisted snakes. Algol is her eye, omega and pi her cheeks, rho her tongue.
       The right knee is raised at lambda with mu on the shin and c (48 Per) on the calf; the
       left leg has nu on the thigh, epsilon at the knee, xi on the shin, zeta (Atik) at the
       heel and omicron on the sandal's wing. -->
