<svg xmlns="http://www.w3.org/2000/svg" viewBox="-136 -140 300 315">
  <!-- Cygnus, the swan: flying south-west along the Milky Way with its long neck stretched out.
       Deneb sits at the root of the tail, Sadr in the breast, eta on the neck and Albireo at the base of the bill.
       delta at the bend of the west wing, iota and kappa on its primaries; epsilon (Aljanah)
       at the bend of the east wing and zeta on its primaries. -->
  <!-- Head and bill: rounded crown, Albireo at the base of the bill -->
  <path d="M 119.6 124 C 126.6 131.1 136 130.8 144.5 138.6 C 149 142.6 148.8 147.6 148 152.4 C 150.8 154.8 154 157.4 156.8 159.6 C 157.6 160.3 157 161.2 155.8 161.3 C 151.4 160.6 146.4 159.2 142.6 157.6 C 139.6 156.4 136.4 156.1 133.1 154.5 C 129.2 151.3 125.9 144.6 120.9 139.8"/>
  <!-- eye -->
  <path class="fine" d="M 143.4 145.9 Q 145.4 146 145.4 147.9 Q 143.6 147.8 143.4 145.9"/>
  <!-- gape -->
  <path class="fine" d="M 143.8 156.8 Q 149.4 158.6 155.8 160.3"/>
  <!-- neck swelling into the breast, delta side -->
  <path d="M 119.6 124 C 111.1 115.5 102.8 105.9 94.9 96.8 C 79.1 78.8 64.2 48.2 48.2 38.5"/>
  <!-- neck swelling into the breast, epsilon side -->
  <path d="M 120.9 139.8 C 111.5 130.8 96.1 115.6 88 106.7 C 69 86.1 36.2 85.2 20.4 64.5"/>
