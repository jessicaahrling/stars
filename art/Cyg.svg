  <path d="M 123.8 126.2 C 127.9 129.9 134.7 130.2 140.8 136.1 C 145.5 140.6 147 145.6 147.1 150.5 C 149.8 155.6 152.7 160.8 155 165.3 C 156.3 167.7 154.9 169.8 152.7 168.6 C 148.3 165.8 144 162.3 140.6 159.5 C 132.2 155.8 125.6 146.8 121.2 142.2"/>
