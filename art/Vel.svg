<svg xmlns="http://www.w3.org/2000/svg" viewBox="-145 -100 300 215">
  <!-- Vela, the sail of the ship Argo: a broad square sail hung from a long yard and filled
       by the wind so that both leeches belly out, with a pennant streaming west from the
       masthead towards the stern in Puppis. Topping lifts run from the mast to the yardarms;
       rings hang at the clews and the sheets lead down and inwards from them, and a short
       stub of the mast shows below the foot. Psi sits on the mast above the yard, q and
       Suhail (lambda) in the head of the sail under the yard, mu in the eastern belly, Regor
       (gamma2) on the western leech beside the broken bow of Puppis, phi and Markeb (kappa)
       just above the foot and Alsephina (delta) on it. -->
