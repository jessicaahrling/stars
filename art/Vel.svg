  <!-- Vela, the sail of the ship Argo: one big square sail hung from a long yard, with
       the masthead and a short pennant above the yard, between the table of Antlia and the compass
       of Pyxis, and the mast showing as a fine line behind the cloth. Below the foot a short stub
       of the mast stands on the deck of Carina. The forward clew is at mu, sheeted down to the
       gunwale at the bow; the foot sags over the deck to Alsephina (delta), where the rising
       gunwale hides the rest of it. The after leech comes straight down to Regor (gamma2), where
       hull, poop deck and sail meet. q and psi lie in the head of the sail under the yard, Suhail
       (lambda) in its after part, phi and Markeb (kappa) just above the foot. -->
