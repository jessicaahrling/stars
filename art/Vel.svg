  <!-- Vela, the sail of the ship Argo: one big square sail hung from a long yard under the
       table of Antlia. The mast stands in the middle of the yard, with a short masthead and its
       truck above it, and runs straight down over the cloth to the deck of Carina, with Markeb
       (kappa) where it crosses the foot of the sail. The fore leech comes down past mu to the forward clew, sheeted down to
       the gunwale at the bow; the foot sags over the deck to the after clew on the gunwale at
       Alsephina (delta), where the rising gunwale hides the rest of the sail. The after leech
       comes straight down to Regor (gamma2), where hull, poop deck and sail meet. q and psi lie in
       the head of the sail under the yard, Suhail (lambda) in its after part and phi just above
       the foot. Fine lines: folds in the cloth, the aftmost running down to the gunwale, and the
       sheet. -->
