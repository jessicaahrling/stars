<svg xmlns="http://www.w3.org/2000/svg" viewBox="-145 -100 300 215">
  <!-- Vela, the sail of the ship Argo: a broad square sail hung from a long yard and filled
       by the wind so that both leeches belly out, with a pennant streaming west from the
       masthead towards the stern in Puppis. Topping lifts run from the mast to the yardarms;
       a ring hangs at the eastern clew with the sheets leading down and inwards from it, and
       a short stub of the mast shows below the foot. The sail stands on the ship: its lower
       western corner is tucked behind the gunwale of Carina, so from Alsephina to Regor its
       edge runs along just above that gunwale, and the broken bow of Puppis lies just west of
       its western leech. Psi sits on the mast above the yard, q and Suhail (lambda) in the
       head of the sail under the yard, mu in the eastern belly, Regor (gamma2) at the foot of
       the western leech where it meets the gunwale, phi and Markeb (kappa) just above the foot
       and Alsephina (delta) at its western end. -->
