<svg xmlns="http://www.w3.org/2000/svg" viewBox="-150 -100 315 225">
  <!-- Vela, the sail of the ship Argo: a broad square sail hung from a long yard, filled by
       a wind from astern (the stern, Puppis, lies to the west) so that it bellies out
       eastwards, with a pennant streaming east from the masthead. Topping lifts run from the
       masthead to the yardarms; the clews are sheeted down and the mast continues below the
       foot towards the deck in Carina. Psi sits on the masthead, q and Suhail (lambda) in the
       head of the sail under the yard, mu in the eastern belly, Regor (gamma2) on the western
       leech beside the broken bow of Puppis, and phi, Markeb (kappa) and Alsephina (delta)
       along the foot. -->
