  <!-- Pyxis, Lacaille's mariner's compass (Pyxis Nautica, la Boussole): the round bowl of a
       ship's compass seen from above, with the trunnions it hangs by in its gimbals on either
       side. Inside lies the compass card with its graduated rim and an eight-point rose that
       has swung to the north: the north point ends in a fleur-de-lis whose tip is gamma, alpha
       lies on the south point and beta at its tip, so the line of the three stars is the
       card's north-south needle. -->
