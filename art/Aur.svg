<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -136 214 278">
  <!-- Auriga, the charioteer: a bearded man in a Phrygian cap and short belted tunic, facing
       east with his back leg bent and raised behind him. The she-goat lies across his left
       shoulder (Capella on her body); his left arm bends down to the elbow (Almaaz on the
       upper arm) and the hand cups the two kids in the crook of the arm: eta on the kid in
       front, zeta on the one peeking over its back. His right hand (Mahasim) holds the
       driver's whip. Delta in the forward-curling tip of the cap, Menkalinan right shoulder,
       Elnath the heel of the striding foot, Hassaleh the ankle of the raised back foot. -->
