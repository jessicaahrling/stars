<svg xmlns="http://www.w3.org/2000/svg" viewBox="-92 -35 101 148">
  <!-- Pictor (Målaren), Lacaille's Equuleus Pictoris, "le Chevalet et la Palette": a painter's
       tripod easel with a canvas standing on its tray, a brush laid on the tray and the palette
       leaning at its foot. The easel is tilted along the strip of sky between Carina and Dorado.
       Beta sits in the head of the easel where the legs meet, gamma on the canvas, and alpha on
       the palette. -->
  <!-- the easel: rounded head with its hinge, the two front legs, the tray,
       and the back leg disappearing behind the palette -->
  <g>
    <path d="M -16.8 -19.5 L -12.1 -26.7 C -10.4 -29.3 -7.7 -30.7 -5.1 -29.4 C -2.4 -28.2 -1.8 -25.3 -2.7 -22.3 L -5.1 -14 Z"/>
